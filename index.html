<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>CinemaCore Pro | همگام‌سازی کامل</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b141a; --panel: #1e2a32; --accent: #00a884;
            --text: #e9edef; --input-bg: #2a3942; --radius: 16px;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden; -webkit-tap-highlight-color: transparent;
            font-size: 14px;
        }

        /* صفحه ورود – ساده و کوچک */
        #login-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: var(--bg); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; gap: 12px;
        }
        #login-overlay h2 { color: var(--accent); font-size: 20px; }
        #login-overlay input {
            padding: 10px 14px; border-radius: 25px; border: none;
            background: var(--input-bg); color: var(--text); font-size: 15px;
            width: 100%; max-width: 240px; text-align: center; outline: none;
        }
        #login-overlay button {
            padding: 10px 24px; border-radius: 25px; border: none;
            background: var(--accent); color: #fff; font-size: 15px; font-weight: bold;
            cursor: pointer;
        }

        /* لایه اصلی */
        #main-app {
            display: none; flex-direction: column; height: 100%; width: 100%;
        }

        /* ویدیو */
        .player-container {
            background: #000; width: 100%;
            display: flex; align-items: center; justify-content: center;
            max-height: 35vh; flex-shrink: 0;
        }
        video {
            width: 100%; height: auto; max-height: 35vh; display: block;
        }

        /* کنترل‌ها – نوار باریک */
        .controls {
            background: var(--panel); padding: 6px 8px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
            border-bottom: 1px solid #2f3b44; flex-shrink: 0;
        }
        .btn {
            background: var(--input-bg); color: var(--text); border: none;
            border-radius: 25px; font-size: 13px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 36px; height: 36px; padding: 0 12px; transition: 0.2s;
        }
        .btn:active { background: #3b4a54; }
        .btn.accent { background: var(--accent); color: #fff; font-weight: bold; }
        .btn.icon { padding: 0; width: 36px; font-size: 18px; }
        select.btn {
            appearance: none; -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5 8l5 5 5-5z'/></svg>");
            background-repeat: no-repeat; background-position: left 6px center;
            background-size: 12px; padding-left: 22px; padding-right: 8px;
            font-size: 12px;
        }
        #status-tag {
            font-size: 11px; color: #8696a0; margin-right: auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;
        }
        .file-label {
            background: var(--accent); color: #fff; border-radius: 25px;
            padding: 0 14px; height: 36px; display: flex; align-items: center;
            font-size: 13px; font-weight: bold; cursor: pointer;
        }

        /* نوار کاربران */
        .users-bar {
            background: var(--panel); padding: 2px 8px; font-size: 11px;
            display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0;
            border-bottom: 1px solid #2f3b44;
        }
        .user-chip {
            background: #2a3942; padding: 2px 8px; border-radius: 12px;
            display: flex; align-items: center; gap: 3px;
        }

        /* چت */
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages {
            flex: 1; overflow-y: auto; padding: 6px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .chat-message {
            padding: 6px 10px; border-radius: 16px; max-width: 85%;
            word-wrap: break-word; font-size: 13px; line-height: 1.3;
        }
        .msg-sent {
            align-self: flex-end; background: var(--accent); color: #fff;
            border-bottom-left-radius: 6px;
        }
        .msg-received {
            align-self: flex-start; background: #2a3942; color: var(--text);
            border-bottom-right-radius: 6px;
        }
        .msg-info { font-size: 9px; opacity: 0.7; margin-top: 2px; }

        .input-area {
            padding: 6px 8px; background: var(--panel); display: flex;
            gap: 6px; align-items: center; flex-shrink: 0;
        }
        #msg-input {
            flex: 1; padding: 10px 14px; border-radius: 25px; border: none;
            background: var(--input-bg); color: var(--text); font-size: 14px; outline: none;
        }
        #file-uploader { display: none; }

        /* تطبیق برای موبایل‌های خیلی کوچک */
        @media (max-width: 350px) {
            .btn { min-width: 32px; height: 32px; font-size: 12px; padding: 0 8px; }
            .file-label { padding: 0 10px; font-size: 12px; height: 32px; }
        }
    </style>
</head>
<body>

<!-- صفحه ورود -->
<div id="login-overlay">
    <h2>🎬 CinemaCore</h2>
    <input type="text" id="name-input" placeholder="نام شما" autocomplete="off">
    <button id="btn-login">ورود به گروه</button>
</div>

<!-- محتوای اصلی -->
<div id="main-app">
    <div class="player-container">
        <video id="player" playsinline></video>
    </div>

    <div class="controls">
        <label class="file-label" for="file-uploader">📁</label>
        <input type="file" id="file-uploader" accept="video/*">

        <button id="btn-play" class="btn icon" title="پخش">▶️</button>
        <button id="btn-pause" class="btn icon" title="مکث">⏸️</button>

        <select id="speed-select" class="btn" title="سرعت پخش">
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
        </select>

        <span id="status-tag">📡 ...</span>
    </div>

    <div class="users-bar" id="users-bar"></div>

    <div class="chat-area">
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="پیام..." autocomplete="off">
        </div>
    </div>
</div>

<script>
/**
 * ============== 1. Enterprise Network Engine (ACK, Queue, Retry) ==============
 */
class EnterpriseNetworkEngine {
    constructor() {
        this.peer = null;
        this.connections = new Map();
        this.outgoingQueues = new Map();
        this.processedIds = new Set();
        this.heartbeatInterval = 5000;
        this.maxRetries = 5;
        this.retryDelay = 1500;
        this.callbacks = { onData: null, onStatus: null, onPeerConnected: null, onPeerDisconnected: null };
    }

    init() {
        this.peer = new Peer(null, { debug: 0, config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] } });
        this.peer.on('open', (id) => { this.myId = id; this._emitStatus('ready', id); });
        this.peer.on('connection', (conn) => this._handleConnection(conn));
        this.peer.on('disconnected', () => { this._emitStatus('disconnected'); this.peer.reconnect(); });
        this.peer.on('error', (err) => { console.error('Peer error:', err); this._emitStatus('error', err.message); });
    }

    connect(remoteId) {
        if (remoteId === this.myId || this.connections.has(remoteId)) return;
        const conn = this.peer.connect(remoteId, { reliable: true });
        this._handleConnection(conn);
    }

    _handleConnection(conn) {
        conn.on('open', () => {
            this.connections.set(conn.peer, conn);
            this._emitStatus('connected', conn.peer);
            this._startHeartbeat(conn);
            this._resumeQueue(conn.peer);
            if (this.callbacks.onPeerConnected) this.callbacks.onPeerConnected(conn.peer);
        });
        conn.on('data', (data) => this._processIncoming(conn.peer, data));
        conn.on('close', () => {
            this.connections.delete(conn.peer);
            this._emitStatus('disconnected', conn.peer);
            this._stopHeartbeat(conn.peer);
            if (this.callbacks.onPeerDisconnected) this.callbacks.onPeerDisconnected(conn.peer);
        });
        conn.on('error', (err) => { console.warn('Connection error:', err); this.connections.delete(conn.peer); });
    }

    send(remoteId, payload) {
        const message = { id: this._generateUUID(), type: payload.type || 'CUSTOM', payload, timestamp: Date.now() };
        if (!this.outgoingQueues.has(remoteId)) this.outgoingQueues.set(remoteId, new Map());
        const queue = this.outgoingQueues.get(remoteId);
        queue.set(message.id, { message, retries: 0, timer: null });
        this._attemptSend(remoteId, message);
    }

    _attemptSend(remoteId, message) {
        const conn = this.connections.get(remoteId);
        if (!conn || !conn.open) { this._scheduleRetry(remoteId, message); return; }
        try { conn.send(message); this._scheduleRetry(remoteId, message); } catch (e) { this._scheduleRetry(remoteId, message); }
    }

    _scheduleRetry(remoteId, message) {
        const queue = this.outgoingQueues.get(remoteId);
        if (!queue) return;
        const entry = queue.get(message.id);
        if (!entry) return;
        if (entry.timer) clearTimeout(entry.timer);
        if (entry.retries >= this.maxRetries) { queue.delete(message.id); this._emitStatus('send_failed', message.id); return; }
        entry.timer = setTimeout(() => { entry.retries++; this._attemptSend(remoteId, message); }, this.retryDelay);
    }

    _processIncoming(senderId, data) {
        if (data.type === 'ACK') { this._handleAck(senderId, data.ackFor); return; }
        if (this.processedIds.has(data.id)) return;
        this.processedIds.add(data.id);
        this._sendAck(senderId, data.id);
        if (this.callbacks.onData) this.callbacks.onData(senderId, data.payload || data);
    }

    _sendAck(peerId, originalMsgId) {
        const conn = this.connections.get(peerId);
        if (conn && conn.open) conn.send({ type: 'ACK', ackFor: originalMsgId });
    }

    _handleAck(peerId, msgId) {
        const queue = this.outgoingQueues.get(peerId);
        if (!queue) return;
        const entry = queue.get(msgId);
        if (entry) { if (entry.timer) clearTimeout(entry.timer); queue.delete(msgId); }
    }

    _resumeQueue(peerId) {
        const queue = this.outgoingQueues.get(peerId);
        if (!queue) return;
        for (let [msgId, entry] of queue) { if (entry.timer) clearTimeout(entry.timer); this._attemptSend(peerId, entry.message); }
    }

    _startHeartbeat(conn) {
        if (conn.heartbeatTimer) return;
        conn.heartbeatTimer = setInterval(() => { if (conn.open) conn.send({ type: 'PING' }); else this._stopHeartbeat(conn.peer); }, this.heartbeatInterval);
    }

    _stopHeartbeat(peerId) {
        const conn = this.connections.get(peerId);
        if (conn && conn.heartbeatTimer) { clearInterval(conn.heartbeatTimer); conn.heartbeatTimer = null; }
    }

    onData(callback) { this.callbacks.onData = callback; }
    onStatus(callback) { this.callbacks.onStatus = callback; }
    onPeerConnected(callback) { this.callbacks.onPeerConnected = callback; }
    onPeerDisconnected(callback) { this.callbacks.onPeerDisconnected = callback; }

    _emitStatus(type, detail) { if (this.callbacks.onStatus) this.callbacks.onStatus({ type, detail, timestamp: Date.now() }); }

    _generateUUID() {
        return 'xxxx-4xxx-yxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); });
    }

    destroy() { if (this.peer) this.peer.destroy(); }
}

/**
 * ============== 2. VideoSyncEngine (همگام‌سازی ویدئو + سرعت پخش) ==============
 */
class VideoSyncEngine {
    constructor(player, network, getPeersFunc) {
        this.player = player;
        this.network = network;
        this.getConnectedPeers = getPeersFunc;
        this.syncLock = false;
        this.bufferingPeers = new Set();
        this.isBuffering = false;
        this.clockOffset = new Map();
        this.latencySamples = new Map();
        this.maxLatencySamples = 8;

        this._bindPlayerEvents();
    }

    _bindPlayerEvents() {
        this.player.addEventListener('play', () => this._onLocalPlay());
        this.player.addEventListener('pause', () => this._onLocalPause());
        this.player.addEventListener('waiting', () => this._onBufferingStart());
        this.player.addEventListener('canplay', () => this._onBufferingEnd());
        this.player.addEventListener('seeked', () => this._onLocalSeek());
    }

    _onLocalPlay() { if (!this.syncLock) this._broadcastSync('play', this.player.currentTime); }
    _onLocalPause() { if (!this.syncLock) this._broadcastSync('pause', this.player.currentTime); }
    _onLocalSeek() { if (!this.syncLock) this._broadcastSync('seek', this.player.currentTime); }

    _onBufferingStart() {
        this.isBuffering = true;
        this._broadcastStatus('buffering', true);
    }
    _onBufferingEnd() {
        this.isBuffering = false;
        this._broadcastStatus('buffering', false);
    }

    setPlaybackRate(rate) {
        this.player.playbackRate = rate;
        // ارسال سرعت جدید به همه
        for (let peerId of this.getConnectedPeers()) {
            this.network.send(peerId, { type: 'SPEED', rate });
        }
    }

    _broadcastSync(action, time) {
        for (let peerId of this.getConnectedPeers()) {
            this.network.send(peerId, { type: 'SYNC', action, time, senderTime: Date.now() });
        }
    }

    _broadcastStatus(key, value) {
        for (let peerId of this.getConnectedPeers()) {
            this.network.send(peerId, { type: 'STATUS', key, value, senderTime: Date.now() });
        }
    }

    handleIncomingSync(senderId, data) {
        if (data.type === 'SYNC') {
            this._applySync(senderId, data.action, data.time, data.senderTime);
        } else if (data.type === 'STATUS') {
            this._applyStatus(senderId, data.key, data.value);
        } else if (data.type === 'SPEED') {
            // اعمال سرعت دریافت شده
            this.player.playbackRate = data.rate;
        }
    }

    _applyStatus(senderId, key, value) {
        if (key === 'buffering') {
            if (value) this.bufferingPeers.add(senderId);
            else this.bufferingPeers.delete(senderId);
            this._checkBufferingState();
        }
    }

    _checkBufferingState() {
        if (this.bufferingPeers.size > 0 && !this.player.paused) {
            this.player.pause();
        } else if (this.bufferingPeers.size === 0 && this.player.paused && this._lastRemoteAction === 'play') {
            this.player.play().catch(() => {});
        }
    }

    _applySync(senderId, action, time, senderTime) {
        if (this.syncLock) return;
        this.syncLock = true;
        const now = Date.now();
        if (senderTime) this._updateClockOffset(senderId, senderTime, now);

        let compensatedTime = time;
        if (senderTime && this.clockOffset.has(senderId)) {
            const offset = this.clockOffset.get(senderId).offset || 0;
            const elapsedSinceSend = now - (senderTime - offset);
            compensatedTime = time + (elapsedSinceSend / 1000);
        }

        try {
            if (this.player.src) {
                if (Math.abs(this.player.currentTime - compensatedTime) > 0.3) {
                    this.player.currentTime = compensatedTime;
                }
                if (action === 'play' || action === 'seek') {
                    this.player.play().catch(() => {});
                } else if (action === 'pause') {
                    this.player.pause();
                }
            }
            this._lastRemoteAction = action;
        } finally {
            setTimeout(() => { this.syncLock = false; }, 300);
        }
    }

    _updateClockOffset(peerId, senderTime, receiveTime) {
        if (!this.latencySamples.has(peerId)) this.latencySamples.set(peerId, []);
        const samples = this.latencySamples.get(peerId);
        const rtt = receiveTime - senderTime;
        const estimatedOffset = rtt / 2;
        samples.push(estimatedOffset);
        if (samples.length > this.maxLatencySamples) samples.shift();
        const avgOffset = samples.reduce((a, b) => a + b, 0) / samples.length;
        this.clockOffset.set(peerId, { offset: avgOffset, lastUpdate: receiveTime });
    }

    static loadVideo(player, file) {
        if (player._blobUrl) URL.revokeObjectURL(player._blobUrl);
        const url = URL.createObjectURL(file);
        player._blobUrl = url;
        player.src = url;
        player.load();
    }

    destroy() {
        if (this.player._blobUrl) URL.revokeObjectURL(this.player._blobUrl);
        // حذف listener ها (اختیاری)
    }
}

/**
 * ============== 3. اجرای اصلی برنامه ==============
 */
(function() {
    const loginOverlay = document.getElementById('login-overlay');
    const nameInput = document.getElementById('name-input');
    const btnLogin = document.getElementById('btn-login');
    const mainApp = document.getElementById('main-app');
    const player = document.getElementById('player');
    const fileUploader = document.getElementById('file-uploader');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const speedSelect = document.getElementById('speed-select');
    const statusTag = document.getElementById('status-tag');
    const usersBar = document.getElementById('users-bar');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');

    let myName = '';
    let mqttClient = null;
    const network = new EnterpriseNetworkEngine();
    const connectedPeers = new Map(); // peerId -> name
    let videoSync;

    const chatHistory = [];
    const HISTORY_LENGTH = 20;

    function getConnectedPeerIds() { return connectedPeers.keys(); }

    function addMessage(text, isSent, senderName = '') {
        const div = document.createElement('div');
        div.className = `chat-message ${isSent ? 'msg-sent' : 'msg-received'}`;
        const sender = isSent ? 'من' : (senderName || 'ناشناس');
        div.innerHTML = `<div>${escapeHtml(text)}</div><div class="msg-info">${sender} • ${new Date().toLocaleTimeString('fa-IR')}</div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        const msgObj = { text, sender: isSent ? myName : senderName, timestamp: Date.now(), id: Date.now().toString(36)+Math.random() };
        chatHistory.push(msgObj);
        while (chatHistory.length > HISTORY_LENGTH) chatHistory.shift();
    }

    function escapeHtml(str) { return str.replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[m]); }

    function updateUsersBar() {
        usersBar.innerHTML = `<span class="user-chip">👤 ${myName}</span>` +
            Array.from(connectedPeers.entries()).map(([id, name]) => `<span class="user-chip">👤 ${name || id.substring(0,6)}</span>`).join('');
    }

    function sendHistory(peerId) {
        network.send(peerId, { type: 'HISTORY', messages: chatHistory.slice(-HISTORY_LENGTH) });
    }

    // ورود
    btnLogin.addEventListener('click', () => {
        const name = nameInput.value.trim();
        if (!name) return alert('نام خود را وارد کنید');
        myName = name;
        loginOverlay.style.display = 'none';
        mainApp.style.display = 'flex';
        updateUsersBar();

        videoSync = new VideoSyncEngine(player, network, getConnectedPeerIds);

        mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
        mqttClient.on('connect', () => {
            mqttClient.subscribe('cinema_mesh_room');
            mqttClient.publish('cinema_mesh_room', JSON.stringify({ peerId: network.myId, name: myName }));
        });
        mqttClient.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                if (data.peerId && data.peerId !== network.myId) {
                    network.connect(data.peerId);
                    if (data.name) { connectedPeers.set(data.peerId, data.name); updateUsersBar(); }
                }
            } catch (e) {}
        });

        network.init();

        network.onStatus((status) => {
            if (status.type === 'ready') {
                statusTag.textContent = `✅ ${status.detail.substring(0,6)}`;
                if (mqttClient && mqttClient.connected) {
                    mqttClient.publish('cinema_mesh_room', JSON.stringify({ peerId: network.myId, name: myName }));
                }
            } else if (status.type === 'connected') {
                statusTag.textContent = `🔗 ${status.detail.substring(0,6)}`;
                network.send(status.detail, { type: 'HELLO', name: myName });
            }
        });

        network.onPeerConnected = (peerId) => { sendHistory(peerId); };
        network.onPeerDisconnected = (peerId) => {
            connectedPeers.delete(peerId);
            updateUsersBar();
            if (videoSync) {
                videoSync.bufferingPeers.delete(peerId);
                videoSync.clockOffset.delete(peerId);
                videoSync.latencySamples.delete(peerId);
                videoSync._checkBufferingState();
            }
        };

        network.onData((senderId, data) => {
            switch (data.type) {
                case 'HELLO':
                    connectedPeers.set(senderId, data.name || 'ناشناس');
                    updateUsersBar();
                    sendHistory(senderId);
                    break;
                case 'HISTORY':
                    data.messages.forEach(msg => {
                        if (!chatHistory.find(m => m.id === msg.id)) addMessage(msg.text, false, msg.sender);
                    });
                    break;
                case 'SYNC':
                case 'STATUS':
                case 'SPEED':
                    videoSync.handleIncomingSync(senderId, data);
                    break;
                case 'CHAT':
                    addMessage(data.text, false, data.sender);
                    break;
            }
        });
    });

    // کنترل‌های UI
    btnPlay.addEventListener('click', () => {
        if (!player.src) return alert('ابتدا فیلم انتخاب کنید');
        player.play().catch(() => {});
    });
    btnPause.addEventListener('click', () => {
        if (!player.src) return;
        player.pause();
    });

    // همگام‌سازی سرعت – جایگزینی مستقیم onChange
    speedSelect.addEventListener('change', () => {
        const rate = parseFloat(speedSelect.value);
        videoSync.setPlaybackRate(rate);
    });

    fileUploader.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) VideoSyncEngine.loadVideo(player, file);
    });

    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && msgInput.value.trim()) {
            const text = msgInput.value.trim();
            addMessage(text, true);
            for (let peerId of getConnectedPeerIds()) {
                network.send(peerId, { type: 'CHAT', text, sender: myName });
            }
            msgInput.value = '';
        }
    });

    window.addEventListener('beforeunload', () => {
        network.destroy();
        if (mqttClient) mqttClient.end();
        if (videoSync) videoSync.destroy();
    });
})();
</script>
</body>
</html>
