<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>CinemaCore Pro | همگام‌سازی کامل با نوار پیشرفت</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0b141a; --panel: #1e2a32; --accent: #00a884;
            --text: #e9edef; --input-bg: #2a3942; --radius: 16px;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden; font-size: 14px;
        }
        #login-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: var(--bg); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; gap: 12px;
        }
        #login-overlay h2 { color: var(--accent); font-size: 20px; }
        #login-overlay input {
            padding: 10px 14px; border-radius: 25px; border: none;
            background: var(--input-bg); color: var(--text); font-size: 15px;
            width: 100%; max-width: 240px; text-align: center; outline: none;
        }
        #login-overlay button {
            padding: 10px 24px; border-radius: 25px; border: none;
            background: var(--accent); color: #fff; font-size: 15px; font-weight: bold;
            cursor: pointer;
        }
        #main-app {
            display: none; flex-direction: column; height: 100%; width: 100%;
        }
        .player-container {
            background: #000; width: 100%;
            display: flex; align-items: center; justify-content: center;
            max-height: 35vh; flex-shrink: 0;
            position: relative;
        }
        video {
            width: 100%; height: auto; max-height: 35vh; display: block;
        }
        /* کنترل‌های اصلی */
        .controls {
            background: var(--panel); padding: 6px 8px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
            border-bottom: 1px solid #2f3b44; flex-shrink: 0;
        }
        .btn {
            background: var(--input-bg); color: var(--text); border: none;
            border-radius: 25px; font-size: 13px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 36px; height: 36px; padding: 0 12px; transition: 0.2s;
        }
        .btn:active { background: #3b4a54; }
        .btn.accent { background: var(--accent); color: #fff; font-weight: bold; }
        .btn.icon { padding: 0; width: 36px; font-size: 18px; }
        select.btn {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5 8l5 5 5-5z'/></svg>");
            background-repeat: no-repeat; background-position: left 6px center;
            background-size: 12px; padding-left: 22px; padding-right: 8px;
        }
        #status-tag {
            font-size: 11px; color: #8696a0; margin-right: auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px;
        }
        /* نوار پیشرفت (seekbar) */
        .progress-container {
            background: var(--panel); padding: 4px 8px;
            display: flex; align-items: center; gap: 8px;
            flex-shrink: 0;
            border-bottom: 1px solid #2f3b44;
        }
        .time-display {
            font-size: 12px; font-family: monospace;
            background: #0b141a; padding: 2px 6px; border-radius: 12px;
            min-width: 70px; text-align: center;
        }
        .seek-slider {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #2a3942;
            border-radius: 5px;
            outline: none;
        }
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            box-shadow: 0 0 2px black;
        }
        .users-bar {
            background: var(--panel); padding: 2px 8px; font-size: 11px;
            display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0;
            border-bottom: 1px solid #2f3b44;
        }
        .user-chip {
            background: #2a3942; padding: 2px 8px; border-radius: 12px;
            display: flex; align-items: center; gap: 3px;
        }
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages {
            flex: 1; overflow-y: auto; padding: 6px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .chat-message {
            padding: 6px 10px; border-radius: 16px; max-width: 85%;
            word-wrap: break-word; font-size: 13px; line-height: 1.3;
        }
        .msg-sent { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-left-radius: 6px; }
        .msg-received { align-self: flex-start; background: #2a3942; color: var(--text); border-bottom-right-radius: 6px; }
        .msg-info { font-size: 9px; opacity: 0.7; margin-top: 2px; }
        .input-area {
            padding: 6px 8px; background: var(--panel); display: flex;
            gap: 6px; align-items: center; flex-shrink: 0;
        }
        #msg-input {
            flex: 1; padding: 10px 14px; border-radius: 25px; border: none;
            background: var(--input-bg); color: var(--text); font-size: 14px; outline: none;
        }
        @media (max-width: 350px) {
            .btn { min-width: 32px; height: 32px; font-size: 12px; padding: 0 8px; }
            .time-display { font-size: 10px; min-width: 60px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <h2>🎬 CinemaCore Pro</h2>
    <input type="text" id="name-input" placeholder="نام شما" autocomplete="off">
    <button id="btn-login">ورود به گروه</button>
</div>

<div id="main-app">
    <div class="player-container">
        <video id="player" playsinline crossorigin="anonymous"></video>
    </div>

    <!-- نوار پیشرفت (seekbar) و زمان -->
    <div class="progress-container">
        <span class="time-display" id="current-time">00:00</span>
        <input type="range" id="seek-bar" class="seek-slider" value="0" step="0.01">
        <span class="time-display" id="duration">00:00</span>
        <button id="fullscreen-btn" class="btn icon" title="تمام صفحه">⤢</button>
    </div>

    <div class="controls">
        <button id="btn-play" class="btn icon">▶️</button>
        <button id="btn-pause" class="btn icon">⏸️</button>
        <select id="speed-select" class="btn">
            <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
            <option value="1" selected>1x</option><option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
        <span id="status-tag">📡 در حال اتصال...</span>
    </div>

    <div class="users-bar" id="users-bar"></div>

    <div class="chat-area">
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="پیام..." autocomplete="off">
        </div>
    </div>
</div>

<script>
(function(){
    // ========== ویدئوی ثابت (قابل تغییر) ==========
    const STATIC_VIDEO_URL = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
    
    // ========== عناصر DOM ==========
    const loginOverlay = document.getElementById('login-overlay');
    const nameInput = document.getElementById('name-input');
    const btnLogin = document.getElementById('btn-login');
    const mainApp = document.getElementById('main-app');
    const player = document.getElementById('player');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const speedSelect = document.getElementById('speed-select');
    const statusTag = document.getElementById('status-tag');
    const usersBar = document.getElementById('users-bar');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeSpan = document.getElementById('current-time');
    const durationSpan = document.getElementById('duration');
    const fullscreenBtn = document.getElementById('fullscreen-btn');

    let myName = '';
    let myPeerId = null;
    let mqttClient = null;
    let connectedPeers = new Map(); // peerId -> { name, conn }
    const MAX_PEERS = 10;
    let videoSync = null;
    let isSeeking = false; // برای جلوگیری از حلقه بازخورد در هنگام جابجایی با اسلایدر

    // ========== توابع کمکی امن ==========
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function sanitizeName(name) {
        let cleaned = name.trim().slice(0, 20);
        cleaned = cleaned.replace(/[<>]/g, '');
        return cleaned || 'ناشناس';
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hrs > 0) return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        return `${mins}:${secs.toString().padStart(2,'0')}`;
    }

    function addMessage(text, isSent, senderName = '') {
        const div = document.createElement('div');
        div.className = `chat-message ${isSent ? 'msg-sent' : 'msg-received'}`;
        const safeText = escapeHtml(text);
        const displayName = isSent ? 'من' : escapeHtml(senderName || 'ناشناس');
        const time = new Date().toLocaleTimeString('fa-IR');
        div.innerHTML = `<div>${safeText}</div><div class="msg-info">${displayName} • ${time}</div>`;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function updateUsersBar() {
        let html = `<span class="user-chip">👤 ${escapeHtml(myName)}</span>`;
        for (let [id, info] of connectedPeers.entries()) {
            html += `<span class="user-chip">👤 ${escapeHtml(info.name)}</span>`;
        }
        usersBar.innerHTML = html;
    }

    // ========== کلاس شبکه قابل اعتماد (همان نسخه قبل با بهبود جزئی) ==========
    class EnterpriseNetworkEngine {
        constructor() {
            this.peer = null;
            this.connections = new Map();
            this.outgoingQueues = new Map();
            this.processedIds = new Set();
            this.heartbeatInterval = 5000;
            this.maxRetries = 5;
            this.retryDelay = 1500;
            this.callbacks = { onData: null, onStatus: null, onPeerConnected: null, onPeerDisconnected: null };
        }

        init() {
            const iceServers = [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ];
            this.peer = new Peer(null, { debug: 0, config: { iceServers } });
            this.peer.on('open', (id) => { myPeerId = id; this._emitStatus('ready', id); });
            this.peer.on('connection', (conn) => this._handleConnection(conn));
            this.peer.on('disconnected', () => { this._emitStatus('disconnected'); this.peer.reconnect(); });
            this.peer.on('error', (err) => { console.error('Peer error:', err); this._emitStatus('error', err.message); });
        }

        connect(remoteId) {
            if (remoteId === myPeerId || this.connections.has(remoteId)) return;
            if (connectedPeers.size >= MAX_PEERS) {
                this._emitStatus('error', 'حداکثر تعداد همتایان پر شده است');
                return;
            }
            const conn = this.peer.connect(remoteId, { reliable: true });
            this._handleConnection(conn);
        }

        _handleConnection(conn) {
            conn.on('open', () => {
                this.connections.set(conn.peer, conn);
                this._emitStatus('connected', conn.peer);
                this._startHeartbeat(conn);
                this._resumeQueue(conn.peer);
                if (this.callbacks.onPeerConnected) this.callbacks.onPeerConnected(conn.peer, conn);
            });
            conn.on('data', (data) => this._processIncoming(conn.peer, data));
            conn.on('close', () => {
                this.connections.delete(conn.peer);
                this._emitStatus('disconnected', conn.peer);
                this._stopHeartbeat(conn.peer);
                if (this.callbacks.onPeerDisconnected) this.callbacks.onPeerDisconnected(conn.peer);
            });
            conn.on('error', (err) => { console.warn('Connection error:', err); this.connections.delete(conn.peer); });
        }

        send(remoteId, payload) {
            const message = { id: this._generateUUID(), type: payload.type || 'CUSTOM', payload, timestamp: Date.now() };
            if (!this.outgoingQueues.has(remoteId)) this.outgoingQueues.set(remoteId, new Map());
            const queue = this.outgoingQueues.get(remoteId);
            queue.set(message.id, { message, retries: 0, timer: null });
            this._attemptSend(remoteId, message);
        }

        _attemptSend(remoteId, message) {
            const conn = this.connections.get(remoteId);
            if (!conn || !conn.open) { this._scheduleRetry(remoteId, message); return; }
            try { conn.send(message); this._scheduleRetry(remoteId, message); } catch(e) { this._scheduleRetry(remoteId, message); }
        }

        _scheduleRetry(remoteId, message) {
            const queue = this.outgoingQueues.get(remoteId);
            if (!queue) return;
            const entry = queue.get(message.id);
            if (!entry) return;
            if (entry.timer) clearTimeout(entry.timer);
            if (entry.retries >= this.maxRetries) { queue.delete(message.id); return; }
            entry.timer = setTimeout(() => { entry.retries++; this._attemptSend(remoteId, message); }, this.retryDelay);
        }

        _processIncoming(senderId, data) {
            if (data.type === 'ACK') { this._handleAck(senderId, data.ackFor); return; }
            if (this.processedIds.has(data.id)) return;
            this.processedIds.add(data.id);
            this._sendAck(senderId, data.id);
            if (this.callbacks.onData) this.callbacks.onData(senderId, data.payload || data);
        }

        _sendAck(peerId, originalMsgId) {
            const conn = this.connections.get(peerId);
            if (conn && conn.open) conn.send({ type: 'ACK', ackFor: originalMsgId });
        }

        _handleAck(peerId, msgId) {
            const queue = this.outgoingQueues.get(peerId);
            if (!queue) return;
            const entry = queue.get(msgId);
            if (entry) { if (entry.timer) clearTimeout(entry.timer); queue.delete(msgId); }
        }

        _resumeQueue(peerId) {
            const queue = this.outgoingQueues.get(peerId);
            if (!queue) return;
            for (let [msgId, entry] of queue) {
                if (entry.timer) clearTimeout(entry.timer);
                this._attemptSend(peerId, entry.message);
            }
        }

        _startHeartbeat(conn) {
            if (conn.heartbeatTimer) return;
            conn.heartbeatTimer = setInterval(() => { if (conn.open) conn.send({ type: 'PING' }); }, this.heartbeatInterval);
        }

        _stopHeartbeat(peerId) {
            const conn = this.connections.get(peerId);
            if (conn && conn.heartbeatTimer) { clearInterval(conn.heartbeatTimer); conn.heartbeatTimer = null; }
        }

        onData(cb) { this.callbacks.onData = cb; }
        onStatus(cb) { this.callbacks.onStatus = cb; }
        onPeerConnected(cb) { this.callbacks.onPeerConnected = cb; }
        onPeerDisconnected(cb) { this.callbacks.onPeerDisconnected = cb; }

        _emitStatus(type, detail) { if (this.callbacks.onStatus) this.callbacks.onStatus({ type, detail, timestamp: Date.now() }); }
        _generateUUID() { return 'xxxx-4xxx-yxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); }); }
        destroy() { if (this.peer) this.peer.destroy(); }
    }

    // ========== موتور همگام‌سازی ویدئو (تقویت شده برای نوار پیشرفت) ==========
    class VideoSyncEngine {
        constructor(player, network, getPeersFunc) {
            this.player = player;
            this.network = network;
            this.getConnectedPeers = getPeersFunc;
            this.syncLock = false;
            this.bufferingPeers = new Set();
            this.clockOffset = new Map();
            this.latencySamples = new Map();
            this.maxLatencySamples = 8;
            this._bindPlayerEvents();
        }
        _bindPlayerEvents() {
            this.player.addEventListener('play', () => this._onLocalPlay());
            this.player.addEventListener('pause', () => this._onLocalPause());
            this.player.addEventListener('waiting', () => this._onBufferingStart());
            this.player.addEventListener('canplay', () => this._onBufferingEnd());
            this.player.addEventListener('seeked', () => this._onLocalSeek());
            this.player.addEventListener('ratechange', () => this._onLocalRateChange());
            // به‌روزرسانی نوار پیشرفت توسط timeupdate در جای دیگر انجام می‌شود.
        }
        _onLocalPlay() { if (!this.syncLock) this._broadcastSync('play', this.player.currentTime); }
        _onLocalPause() { if (!this.syncLock) this._broadcastSync('pause', this.player.currentTime); }
        _onLocalSeek() { if (!this.syncLock) this._broadcastSync('seek', this.player.currentTime); }
        _onLocalRateChange() { if (!this.syncLock) this._broadcastSpeed(this.player.playbackRate); }
        _onBufferingStart() { this._broadcastStatus('buffering', true); }
        _onBufferingEnd() { this._broadcastStatus('buffering', false); }
        _broadcastSync(action, time) {
            for (let peerId of this.getConnectedPeers()) {
                this.network.send(peerId, { type: 'SYNC', action, time, senderTime: Date.now() });
            }
        }
        _broadcastSpeed(rate) {
            for (let peerId of this.getConnectedPeers()) {
                this.network.send(peerId, { type: 'SPEED', rate });
            }
        }
        _broadcastStatus(key, value) {
            for (let peerId of this.getConnectedPeers()) {
                this.network.send(peerId, { type: 'STATUS', key, value });
            }
        }
        setPlaybackRate(rate) {
            if (this.player.playbackRate !== rate) this.player.playbackRate = rate;
            this._broadcastSpeed(rate);
        }
        handleIncomingSync(senderId, data) {
            if (data.type === 'SYNC') this._applySync(senderId, data.action, data.time, data.senderTime);
            else if (data.type === 'SPEED') this.player.playbackRate = data.rate;
            else if (data.type === 'STATUS') this._applyStatus(senderId, data.key, data.value);
        }
        _applyStatus(senderId, key, value) {
            if (key === 'buffering') {
                if (value) this.bufferingPeers.add(senderId);
                else this.bufferingPeers.delete(senderId);
                this._checkBufferingState();
            }
        }
        _checkBufferingState() {
            if (this.bufferingPeers.size > 0 && !this.player.paused) this.player.pause();
            else if (this.bufferingPeers.size === 0 && this.player.paused && this._lastRemoteAction === 'play') this.player.play().catch(()=>{});
        }
        _applySync(senderId, action, time, senderTime) {
            if (this.syncLock) return;
            this.syncLock = true;
            let compensatedTime = time;
            if (senderTime) {
                const now = Date.now();
                let offset = 0;
                if (this.clockOffset.has(senderId)) offset = this.clockOffset.get(senderId).offset || 0;
                const elapsed = (now - (senderTime - offset)) / 1000;
                compensatedTime = time + elapsed;
                if (!this.latencySamples.has(senderId)) this.latencySamples.set(senderId, []);
                const samples = this.latencySamples.get(senderId);
                const rtt = now - senderTime;
                const estOffset = rtt/2;
                samples.push(estOffset);
                if(samples.length>this.maxLatencySamples) samples.shift();
                const avgOffset = samples.reduce((a,b)=>a+b,0)/samples.length;
                this.clockOffset.set(senderId, { offset: avgOffset, lastUpdate: now });
            }
            try {
                if (this.player.src && Math.abs(this.player.currentTime - compensatedTime) > 0.3) {
                    this.player.currentTime = compensatedTime;
                }
                if (action === 'play' || action === 'seek') this.player.play().catch(()=>{});
                else if (action === 'pause') this.player.pause();
                this._lastRemoteAction = action;
            } finally { setTimeout(()=>{ this.syncLock = false; }, 300); }
        }
        destroy() { /* cleanup */ }
    }

    // ========== راه‌اندازی اصلی ==========
    const network = new EnterpriseNetworkEngine();
    let videoSyncEngine = null;

    function getConnectedPeerIds() { return Array.from(connectedPeers.keys()); }

    function sendHelloToPeer(peerId) {
        network.send(peerId, { type: 'HELLO', name: myName });
    }

    function loadStaticVideo() {
        player.src = STATIC_VIDEO_URL;
        player.load();
        addMessage(`🎬 ویدئوی ثابت بارگذاری شد`, false, 'سیستم');
    }

    // به‌روزرسانی نوار پیشرفت و زمان
    function updateProgress() {
        if (!isSeeking && player.duration) {
            const percent = (player.currentTime / player.duration) * 100;
            seekBar.value = percent;
            currentTimeSpan.textContent = formatTime(player.currentTime);
        }
        if (player.duration && !isNaN(player.duration)) {
            durationSpan.textContent = formatTime(player.duration);
            seekBar.max = 100;
        }
    }

    // جابجایی با اسلایدر
    function handleSeek() {
        if (!player.duration) return;
        isSeeking = true;
        const seekTo = (seekBar.value / 100) * player.duration;
        player.currentTime = seekTo;
        // broadcast توسط رویداد seeked انجام می‌شود
        setTimeout(() => { isSeeking = false; }, 100);
    }

    // تمام صفحه
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => console.warn(err));
        } else {
            document.exitFullscreen();
        }
    }

    // رویدادهای ورود و راه‌اندازی
    btnLogin.addEventListener('click', () => {
        let rawName = nameInput.value.trim();
        if (!rawName) return alert('لطفاً نام خود را وارد کنید');
        myName = sanitizeName(rawName);
        loginOverlay.style.display = 'none';
        mainApp.style.display = 'flex';
        updateUsersBar();

        network.init();
        network.onStatus((status) => {
            if (status.type === 'ready') {
                statusTag.textContent = `🆔 ${status.detail.substring(0,6)}`;
                mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
                mqttClient.on('connect', () => {
                    mqttClient.subscribe('cinema_mesh_room_pro');
                    mqttClient.publish('cinema_mesh_room_pro', JSON.stringify({ peerId: myPeerId, name: myName }));
                });
                mqttClient.on('message', (topic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if (data.peerId && data.peerId !== myPeerId && !connectedPeers.has(data.peerId)) {
                            network.connect(data.peerId);
                        }
                    } catch(e) {}
                });
                loadStaticVideo();
            } else if (status.type === 'connected') {
                statusTag.textContent = `🔗 ${status.detail.substring(0,6)}`;
                sendHelloToPeer(status.detail);
            } else if (status.type === 'error') {
                statusTag.textContent = `⚠️ خطا`;
            }
        });

        network.onPeerConnected((peerId, conn) => {
            if (!connectedPeers.has(peerId)) connectedPeers.set(peerId, { name: 'در حال دریافت...', conn });
            updateUsersBar();
        });

        network.onPeerDisconnected((peerId) => {
            connectedPeers.delete(peerId);
            if (videoSyncEngine) {
                videoSyncEngine.bufferingPeers.delete(peerId);
                videoSyncEngine.clockOffset.delete(peerId);
                videoSyncEngine.latencySamples.delete(peerId);
            }
            updateUsersBar();
        });

        network.onData((senderId, data) => {
            switch (data.type) {
                case 'HELLO':
                    if (connectedPeers.has(senderId)) {
                        connectedPeers.get(senderId).name = sanitizeName(data.name);
                    } else {
                        connectedPeers.set(senderId, { name: sanitizeName(data.name), conn: null });
                    }
                    updateUsersBar();
                    break;
                case 'SYNC': case 'STATUS': case 'SPEED':
                    if (videoSyncEngine) videoSyncEngine.handleIncomingSync(senderId, data);
                    break;
                case 'CHAT':
                    addMessage(data.text, false, data.sender);
                    break;
                default: break;
            }
        });

        videoSyncEngine = new VideoSyncEngine(player, network, getConnectedPeerIds);
    });

    // اتصال رویدادهای UI
    btnPlay.addEventListener('click', () => { if(player.src) player.play().catch(e=>alert('خطا در پخش')); });
    btnPause.addEventListener('click', () => { if(player.src) player.pause(); });
    speedSelect.addEventListener('change', () => { if(videoSyncEngine) videoSyncEngine.setPlaybackRate(parseFloat(speedSelect.value)); });
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && msgInput.value.trim()) {
            const text = msgInput.value.trim();
            addMessage(text, true);
            for (let peerId of getConnectedPeerIds()) {
                network.send(peerId, { type: 'CHAT', text, sender: myName });
            }
            msgInput.value = '';
        }
    });
    seekBar.addEventListener('input', handleSeek);
    player.addEventListener('timeupdate', updateProgress);
    player.addEventListener('loadedmetadata', () => {
        durationSpan.textContent = formatTime(player.duration);
        seekBar.max = 100;
    });
    fullscreenBtn.addEventListener('click', toggleFullscreen);

    window.addEventListener('beforeunload', () => {
        if (network) network.destroy();
        if (mqttClient) mqttClient.end();
        if (videoSyncEngine) videoSyncEngine.destroy();
    });
})();
</script>
</body>
</html>
