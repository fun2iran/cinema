<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>CinemaCore Pro | پخش همگام فیلم + چت P2P</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b141a;
            --panel: #202c33;
            --accent: #00a884;
            --text: #e9edef;
            --input-bg: #2a3942;
            --shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* ویدیو پلیر */
        .player-container {
            position: relative;
            width: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            max-height: 45vh;
            flex-shrink: 0;
        }
        video {
            width: 100%;
            height: auto;
            max-height: 45vh;
            display: block;
        }

        /* کنترل‌ها */
        .controls {
            background: var(--panel);
            padding: 12px 10px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #2a3942;
            flex-shrink: 0;
        }
        .btn {
            background: var(--input-bg);
            color: var(--text);
            border: none;
            padding: 10px 14px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            transition: 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .btn:active { background: #3b4a54; }
        .btn.accent { background: var(--accent); color: #fff; font-weight: bold; }

        select.btn {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5 8l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: left 8px center;
            background-size: 16px;
            padding-left: 28px;
            padding-right: 14px;
        }

        #status-tag {
            font-size: 12px;
            margin-right: auto;
            color: #8696a0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 120px;
        }

        /* بخش چت */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg);
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-message {
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 85%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-sent {
            align-self: flex-end;
            background: var(--accent);
            color: #fff;
            border-bottom-left-radius: 4px;
        }
        .msg-received {
            align-self: flex-start;
            background: var(--panel);
            color: var(--text);
            border-bottom-right-radius: 4px;
        }
        .msg-info {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .input-area {
            padding: 8px 10px;
            background: var(--panel);
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }
        #msg-input {
            flex: 1;
            padding: 10px 15px;
            border-radius: 25px;
            border: none;
            background: var(--input-bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }
        #msg-input::placeholder { color: #8696a0; }

        /* نوار اتصال */
        .connection-bar {
            background: var(--panel);
            padding: 6px 10px;
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 13px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }
        .connection-bar input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 20px;
            border: none;
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
            min-width: 100px;
            outline: none;
        }
        .connection-bar .btn { padding: 6px 12px; font-size: 13px; }

        /* مخفی کردن فایل آپلودر واقعی */
        #file-uploader { display: none; }

        /* تطبیق برای موبایل */
        @media (max-width: 400px) {
            .btn { padding: 8px 10px; font-size: 13px; }
        }
    </style>
</head>
<body>

<!-- پلیر ویدیو -->
<div class="player-container">
    <video id="player" playsinline></video>
</div>

<!-- کنترل‌های ویدیو -->
<div class="controls">
    <label class="btn accent" for="file-uploader">📁 انتخاب فیلم</label>
    <input type="file" id="file-uploader" accept="video/*">

    <button id="btn-play" class="btn">▶ پخش</button>
    <button id="btn-pause" class="btn">⏸ مکث</button>

    <select id="speed-select" class="btn">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
    </select>

    <span id="status-tag">📡 در حال دریافت شناسه...</span>
</div>

<!-- نوار اتصال P2P -->
<div class="connection-bar">
    <span style="white-space:nowrap;">شناسه من:</span>
    <strong id="my-peer-id" style="background:var(--input-bg);padding:4px 10px;border-radius:12px;font-size:12px;">---</strong>
    <input type="text" id="remote-id" placeholder="شناسه طرف مقابل">
    <button id="btn-connect" class="btn accent">اتصال</button>
    <button id="btn-copy" class="btn">📋</button>
</div>

<!-- چت -->
<div class="chat-area">
    <div id="messages" class="messages"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." autocomplete="off">
    </div>
</div>

<script>
    (function() {
        // ---------- DOM Elements ----------
        const player = document.getElementById('player');
        const fileUploader = document.getElementById('file-uploader');
        const btnPlay = document.getElementById('btn-play');
        const btnPause = document.getElementById('btn-pause');
        const speedSelect = document.getElementById('speed-select');
        const statusTag = document.getElementById('status-tag');
        const myPeerIdSpan = document.getElementById('my-peer-id');
        const remoteIdInput = document.getElementById('remote-id');
        const btnConnect = document.getElementById('btn-connect');
        const btnCopy = document.getElementById('btn-copy');
        const messagesDiv = document.getElementById('messages');
        const msgInput = document.getElementById('msg-input');

        // ---------- State ----------
        let peer = null;
        let conn = null;                // فعال اتصال با طرف مقابل
        let isSyncing = false;          // جلوگیری از حلقه‌های بی‌نهایت هنگام همگام‌سازی
        let myPeerId = '';

        // ---------- Utility ----------
        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function logStatus(msg) {
            statusTag.textContent = msg;
        }

        // ---------- PeerJS Initialization ----------
        function initPeer() {
            peer = new Peer(null, {
                debug: 0,  // برای کاهش لاگ‌ها 0 تنظیم شود
                config: {
                    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                }
            });

            peer.on('open', (id) => {
                myPeerId = id;
                myPeerIdSpan.textContent = id;
                logStatus('✅ آماده (شناسه دریافت شد)');
            });

            peer.on('connection', (incomingConn) => {
                // اگر از قبل اتصالی وجود داشته باشد، اتصال جدید را قبول می‌کنیم
                if (conn) {
                    incomingConn.on('open', () => incomingConn.close());
                    return;
                }
                setupConnection(incomingConn);
            });

            peer.on('disconnected', () => {
                logStatus('⚠️ قطع ارتباط از سرور، تلاش مجدد...');
                peer.reconnect();
            });

            peer.on('error', (err) => {
                logStatus('❌ خطا: ' + err.message);
                console.error(err);
            });
        }

        // ---------- Connection Handling ----------
        function setupConnection(newConn) {
            conn = newConn;
            conn.on('open', () => {
                logStatus('🔗 متصل به هم‌گام');
                // ارسال وضعیت فعلی ویدیو به طرف مقابل
                if (player.src && !player.paused) {
                    sendSync({ action: 'play', time: player.currentTime });
                }
            });

            conn.on('data', (data) => {
                handleIncomingData(data);
            });

            conn.on('close', () => {
                conn = null;
                logStatus('🔌 اتصال قطع شد');
            });

            conn.on('error', (err) => {
                console.error('Connection error:', err);
                conn = null;
            });
        }

        function connectToPeer(remoteId) {
            if (!peer || remoteId === myPeerId) {
                alert('شناسه نامعتبر');
                return;
            }
            if (conn) {
                conn.close();
            }
            const newConn = peer.connect(remoteId, { reliable: true });
            setupConnection(newConn);
        }

        // ---------- Data Handling ----------
        function handleIncomingData(data) {
            switch (data.type) {
                case 'SYNC':
                    applySync(data);
                    break;
                case 'CHAT':
                    addMessage(data.text, false, data.sender);
                    break;
                default:
                    break;
            }
        }

        function sendSync(syncObj) {
            if (conn && conn.open) {
                conn.send({ type: 'SYNC', ...syncObj });
            }
        }

        function sendChat(text) {
            if (conn && conn.open) {
                conn.send({ type: 'CHAT', text, sender: myPeerId.substring(0,6) });
            }
        }

        // ---------- Synchronization Logic ----------
        function applySync({ action, time }) {
            if (isSyncing) return;         // از حلقه جلوگیری کن
            isSyncing = true;

            try {
                if (player.src) {
                    player.currentTime = time;
                    if (action === 'play') {
                        player.play().catch(() => {});
                    } else if (action === 'pause') {
                        player.pause();
                    }
                }
            } finally {
                setTimeout(() => { isSyncing = false; }, 200);
            }
        }

        // ---------- Player Controls ----------
        function playVideo() {
            if (!player.src) {
                alert('ابتدا یک فایل ویدیویی انتخاب کنید');
                return;
            }
            player.play().then(() => {
                if (!isSyncing) {
                    sendSync({ action: 'play', time: player.currentTime });
                }
            }).catch(e => console.warn('Play failed:', e));
        }

        function pauseVideo() {
            if (!player.src) return;
            player.pause();
            if (!isSyncing) {
                sendSync({ action: 'pause', time: player.currentTime });
            }
        }

        // وقتی کاربر بصورت دستی ویدیو را پلی/پاز کند (از طریق دکمه‌های ما)
        btnPlay.addEventListener('click', playVideo);
        btnPause.addEventListener('click', pauseVideo);

        // همگام‌سازی خودکار هنگام پایان ویدیو (اختیاری)
        player.addEventListener('ended', () => {
            if (!isSyncing) {
                sendSync({ action: 'pause', time: player.duration || 0 });
            }
        });

        // سرعت پخش
        speedSelect.addEventListener('change', () => {
            player.playbackRate = parseFloat(speedSelect.value);
            // سرعت به طرف مقابل ارسال نمی‌شود، صرفاً محلی است
        });

        // انتخاب فایل
        fileUploader.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                player.src = url;
                player.load();
                logStatus('🎬 فیلم بارگذاری شد');
                // اگر متصل هستیم، می‌توانیم همگام‌سازی را اطلاع دهیم
                if (conn && conn.open) {
                    sendSync({ action: 'pause', time: 0 });
                }
            }
        });

        // ---------- Chat ----------
        function addMessage(text, isSent, sender = '') {
            const div = document.createElement('div');
            div.className = `chat-message ${isSent ? 'msg-sent' : 'msg-received'}`;
            div.innerHTML = `<div>${escapeHtml(text)}</div>
                            ${!isSent ? `<div class="msg-info">${sender || 'طرف مقابل'}</div>` : ''}`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
            });
        }

        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && msgInput.value.trim()) {
                const text = msgInput.value.trim();
                addMessage(text, true);
                sendChat(text);
                msgInput.value = '';
            }
        });

        // ---------- Connection UI ----------
        btnConnect.addEventListener('click', () => {
            const remoteId = remoteIdInput.value.trim();
            if (remoteId) {
                connectToPeer(remoteId);
            }
        });

        btnCopy.addEventListener('click', () => {
            if (myPeerId) {
                navigator.clipboard.writeText(myPeerId).then(() => {
                    alert('شناسه کپی شد');
                }).catch(() => {
                    prompt('شناسه شما:', myPeerId);
                });
            }
        });

        // ورود سریع با Enter در فیلد Remote ID
        remoteIdInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                btnConnect.click();
            }
        });

        // ---------- Start ----------
        initPeer();

        // مدیریت قطع اتصال سراسری
        window.addEventListener('beforeunload', () => {
            if (conn) conn.close();
            if (peer) peer.destroy();
        });
    })();
</script>
</body>
</html>
