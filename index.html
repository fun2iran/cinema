<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Cinema Sync</title>
<style>
  body { background:#0f172a; color:#fff; font-family:sans-serif; margin:0; display:flex; justify-content:center; align-items:center; height:100vh; }
  .card { width:100%; max-width:480px; background:#1e293b; padding:20px; border-radius:14px; box-shadow:0 0 20px #000; }
  input,button,select { width:100%; padding:10px; margin:6px 0; border-radius:8px; border:none; font-size:14px; }
  button { background:#3b82f6; color:#fff; cursor:pointer; }
  video { width:100%; border-radius:10px; margin-top:10px; background:#000; }
  #chatLog { background:#0f172a; height:150px; overflow-y:auto; padding:10px; border-radius:10px; margin-top:10px; }
  .msg { margin-bottom:6px; }
  .me { color:#60a5fa; }
  .other { color:#fbbf24; }
  .system { color:#22c55e; }
  #users { font-size:12px; color:#94a3b8; margin-bottom:10px; }
</style>
</head>
<body>

<div class="card" id="login">
  <h2>🎬 ورود به سینما</h2>
  <input id="name" placeholder="نام شما">
  <button onclick="enter()">ورود</button>
</div>

<div class="card" id="app" style="display:none;">
  <h3>👥 کاربران حاضر:</h3>
  <div id="users"></div>

  <h3>🎞 ویدیو</h3>
  <input type="file" id="fileInput" accept="video/*">
  <video id="video" controls></video>

  <button onclick="sync('play')">▶️ پخش</button>
  <button onclick="sync('pause')">⏸ مکث</button>

  <select id="speed" onchange="sync('rate')">
    <option value="1">1x</option>
    <option value="1.2">1.2x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>

  <h3>💬 چت</h3>
  <div id="chatLog"></div>
  <input id="chatInput" placeholder="پیام...">
  <button onclick="sendChat()">ارسال</button>
</div>

<script>
let ws;
let userName;
let users = [];

function enter() {
  userName = document.getElementById("name").value.trim();
  if (!userName) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";

  connectWS();
}

function connectWS() {
  ws = new WebSocket("wss://socketsbay.com/wss/v2/1/demo/");

  ws.onopen = () => {
    send({ type:"join", name:userName });
  };

  ws.onmessage = (msg) => {
    let data;
    try { data = JSON.parse(msg.data); } catch { return; }

    if (data.type === "join") {
      if (!users.includes(data.name)) users.push(data.name);
      updateUsers();
      addMsg("system", data.name + " وارد شد");
    }

    if (data.type === "chat") {
      addMsg(data.name === userName ? "me" : "other", data.name + ": " + data.text);
    }

    if (data.type === "sync" && data.name !== userName) {
      applySync(data);
    }
  };

  ws.onclose = () => {
    addMsg("system", "اتصال قطع شد");
  };
}

function send(obj) {
  ws.send(JSON.stringify(obj));
}

function updateUsers() {
  document.getElementById("users").innerText = users.join(" ، ");
}

function addMsg(cls, text) {
  const log = document.getElementById("chatLog");
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerText = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function sendChat() {
  const text = document.getElementById("chatInput").value.trim();
  if (!text) return;
  send({ type:"chat", name:userName, text });
  document.getElementById("chatInput").value = "";
}

document.getElementById("fileInput").onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const video = document.getElementById("video");
  video.src = url;
  video.load();
};

function sync(action) {
  const video = document.getElementById("video");
  const rate = parseFloat(document.getElementById("speed").value);

  if (action === "play") video.play();
  if (action === "pause") video.pause();
  if (action === "rate") video.playbackRate = rate;

  send({
    type:"sync",
    name:userName,
    action,
    time: video.currentTime,
    rate
  });
}

function applySync(data) {
  const video = document.getElementById("video");

  video.currentTime = data.time;
  video.playbackRate = data.rate;
  document.getElementById("speed").value = data.rate;

  if (data.action === "play") video.play();
  if (data.action === "pause") video.pause();
}
</script>

</body>
</html>
