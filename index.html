<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
    <title>CinemaCore Pro | پیام‌های قابل اطمینان با شماره و ریپلای</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        :root {
            --bg: #0b141a; --panel: #1e2a32; --accent: #00a884;
            --text: #e9edef; --input-bg: #2a3942;
        }
        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100dvh; display: flex; flex-direction: column;
            overflow: hidden; font-size: 14px;
        }
        #login-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: var(--bg); display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; gap: 12px;
        }
        #login-overlay h2 { color: var(--accent); font-size: 20px; }
        #login-overlay input {
            padding: 10px 14px; border-radius: 25px; border: none;
            background: var(--input-bg); color: var(--text); font-size: 15px;
            width: 100%; max-width: 240px; text-align: center; outline: none;
        }
        #login-overlay button {
            padding: 10px 24px; border-radius: 25px; border: none;
            background: var(--accent); color: #fff; font-size: 15px; font-weight: bold;
            cursor: pointer;
        }
        #main-app {
            display: none; flex-direction: column; height: 100%; width: 100%;
        }
        .player-container {
            background: #000; width: 100%;
            display: flex; align-items: center; justify-content: center;
            max-height: 35vh; flex-shrink: 0;
        }
        video {
            width: 100%; height: auto; max-height: 35vh; display: block;
        }
        .progress-row {
            background: var(--panel); padding: 4px 8px;
            display: flex; align-items: center; gap: 6px;
            flex-shrink: 0;
            border-bottom: 1px solid #2f3b44;
        }
        .time-display {
            font-size: 11px; font-family: monospace;
            background: #0b141a; padding: 2px 5px; border-radius: 10px;
            min-width: 55px; text-align: center;
        }
        .seek-slider {
            flex: 1;
            height: 3px;
            -webkit-appearance: none;
            background: #2a3942;
            border-radius: 3px;
            outline: none;
        }
        .seek-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
        }
        .controls-row {
            background: var(--panel); padding: 6px 8px;
            display: flex; flex-wrap: wrap; align-items: center; gap: 4px;
            border-bottom: 1px solid #2f3b44; flex-shrink: 0;
        }
        .btn {
            background: var(--input-bg); color: var(--text); border: none;
            border-radius: 25px; font-size: 13px; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 36px; height: 36px; padding: 0 12px; transition: 0.2s;
        }
        .btn:active { background: #3b4a54; }
        .btn.accent { background: var(--accent); color: #fff; font-weight: bold; }
        .btn.icon { padding: 0; width: 36px; font-size: 18px; }
        select.btn {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='white'><path d='M5 8l5 5 5-5z'/></svg>");
            background-repeat: no-repeat; background-position: left 6px center;
            background-size: 12px; padding-left: 22px; padding-right: 8px;
        }
        #status-tag {
            font-size: 10px; color: #8696a0; margin-right: auto;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100px;
        }
        .file-label {
            background: var(--accent); color: #fff; border-radius: 25px;
            padding: 0 14px; height: 36px; display: flex; align-items: center;
            font-size: 13px; font-weight: bold; cursor: pointer;
        }
        #file-uploader { display: none; }
        .users-bar {
            background: var(--panel); padding: 2px 8px; font-size: 11px;
            display: flex; gap: 4px; flex-wrap: wrap; flex-shrink: 0;
            border-bottom: 1px solid #2f3b44;
        }
        .user-chip {
            background: #2a3942; padding: 2px 8px; border-radius: 12px;
            display: flex; align-items: center; gap: 3px;
        }
        .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .messages {
            flex: 1; overflow-y: auto; padding: 6px;
            display: flex; flex-direction: column; gap: 4px;
        }
        .chat-message {
            padding: 6px 10px; border-radius: 16px; max-width: 85%;
            word-wrap: break-word; font-size: 13px; line-height: 1.3;
            color: white;
        }
        .msg-self {
            align-self: flex-end;
            background-color: var(--accent);
            border-bottom-left-radius: 6px;
        }
        .msg-other {
            align-self: flex-start;
            border-bottom-right-radius: 6px;
        }
        .msg-info {
            font-size: 9px; opacity: 0.8; margin-top: 2px;
            display: flex; gap: 6px; align-items: center;
        }
        .reply-indicator {
            font-size: 10px;
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 10px;
            margin-bottom: 4px;
            display: inline-block;
        }
        .reply-badge {
            background: rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 2px 8px;
            font-size: 10px;
            margin-right: 8px;
            cursor: pointer;
        }
        .input-area {
            padding: 6px 8px; background: var(--panel); display: flex;
            gap: 6px; align-items: center; flex-shrink: 0;
        }
        #msg-input {
            flex: 1; padding: 10px 14px; border-radius: 25px; border: none;
            background: var(--input-bg); color: var(--text); font-size: 14px; outline: none;
        }
        #send-btn {
            background: var(--accent);
            border: none;
            border-radius: 25px;
            padding: 0 16px;
            height: 36px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        @media (max-width: 350px) {
            .btn { min-width: 32px; height: 32px; font-size: 11px; padding: 0 6px; }
            .file-label { padding: 0 10px; font-size: 12px; height: 32px; }
            .time-display { font-size: 9px; min-width: 45px; }
            #send-btn { padding: 0 12px; height: 32px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div id="login-overlay">
    <h2>🎬 CinemaCore Pro</h2>
    <input type="text" id="name-input" placeholder="نام شما" autocomplete="off">
    <button id="btn-login">ورود به گروه</button>
</div>

<div id="main-app">
    <div class="player-container">
        <video id="player" playsinline crossorigin="anonymous"></video>
    </div>

    <div class="progress-row">
        <span class="time-display" id="current-time">00:00</span>
        <input type="range" id="seek-bar" class="seek-slider" value="0" step="0.01">
        <span class="time-display" id="duration">00:00</span>
        <button id="fullscreen-btn" class="btn icon" style="min-width:32px; width:32px;">⤢</button>
    </div>

    <div class="controls-row">
        <button id="btn-play" class="btn icon">▶️</button>
        <button id="btn-pause" class="btn icon">⏸️</button>
        <select id="speed-select" class="btn">
            <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
            <option value="1" selected>1x</option><option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option><option value="2">2x</option>
        </select>
        <label class="file-label" for="file-uploader">📁</label>
        <input type="file" id="file-uploader" accept="video/*">
        <span id="status-tag">📡 در حال اتصال...</span>
    </div>

    <div class="users-bar" id="users-bar"></div>

    <div class="chat-area">
        <div id="messages" class="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="پیام..." autocomplete="off">
            <button id="send-btn">ارسال</button>
        </div>
    </div>
</div>

<script>
(function(){
    // ========== تنظیمات اولیه ==========
    const DEFAULT_VIDEO_URL = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
    
    // DOM elements
    const loginOverlay = document.getElementById('login-overlay');
    const nameInput = document.getElementById('name-input');
    const btnLogin = document.getElementById('btn-login');
    const mainApp = document.getElementById('main-app');
    const player = document.getElementById('player');
    const btnPlay = document.getElementById('btn-play');
    const btnPause = document.getElementById('btn-pause');
    const speedSelect = document.getElementById('speed-select');
    const statusTag = document.getElementById('status-tag');
    const usersBar = document.getElementById('users-bar');
    const messagesDiv = document.getElementById('messages');
    const msgInput = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeSpan = document.getElementById('current-time');
    const durationSpan = document.getElementById('duration');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const fileUploader = document.getElementById('file-uploader');

    let myName = '';
    let myPeerId = null;
    let mqttClient = null;
    let videoSyncEngine = null;
    let isSeeking = false;
    let rafId = null;

    // ========== شبکه همتا به همتا با شماره ترتیبی و تضمین تحویل ==========
    class ReliableChatNetwork {
        constructor() {
            this.peer = null;
            this.connections = new Map(); // peerId -> { conn, outSeq, expectedSeq, pendingBuffer (Map), name }
            this.callbacks = { onData: null, onStatus: null, onPeerConnected: null, onPeerDisconnected: null };
            this.heartbeatInterval = 5000;
        }

        init() {
            const iceServers = [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ];
            this.peer = new Peer(null, { debug: 0, config: { iceServers } });
            this.peer.on('open', (id) => { myPeerId = id; this._emitStatus('ready', id); });
            this.peer.on('connection', (conn) => this._handleConnection(conn));
            this.peer.on('disconnected', () => { this._emitStatus('disconnected'); this.peer.reconnect(); });
            this.peer.on('error', (err) => { console.error('Peer error:', err); this._emitStatus('error', err.message); });
        }

        _handleConnection(conn) {
            conn.on('open', () => {
                const peerId = conn.peer;
                this.connections.set(peerId, {
                    conn: conn,
                    outSeq: 1,
                    expectedSeq: 1,
                    pendingBuffer: new Map(), // seq -> message
                    name: 'در حال دریافت...'
                });
                this._startHeartbeat(conn);
                if (this.callbacks.onPeerConnected) this.callbacks.onPeerConnected(peerId, conn);
            });
            conn.on('data', (data) => this._processIncoming(conn.peer, data));
            conn.on('close', () => {
                this.connections.delete(conn.peer);
                if (this.callbacks.onPeerDisconnected) this.callbacks.onPeerDisconnected(conn.peer);
            });
            conn.on('error', (err) => { console.warn('Connection error:', err); this.connections.delete(conn.peer); });
        }

        sendMessage(peerId, text, replyToSeq = null) {
            const peerData = this.connections.get(peerId);
            if (!peerData) return false;
            const seq = peerData.outSeq++;
            const message = {
                type: 'CHAT',
                seq: seq,
                text: text,
                sender: myName,
                senderId: myPeerId,
                replyToSeq: replyToSeq,
                timestamp: Date.now()
            };
            this._sendReliable(peerId, message);
            // نمایش پیام خودمان بلافاصله
            this._displayChatMessage(myPeerId, seq, text, myName, true, replyToSeq, null);
            return true;
        }

        _sendReliable(peerId, message) {
            const peerData = this.connections.get(peerId);
            if (!peerData) return;
            const conn = peerData.conn;
            if (conn && conn.open) {
                conn.send(message);
            }
        }

        requestMissing(peerId, fromSeq, toSeq) {
            const peerData = this.connections.get(peerId);
            if (!peerData) return;
            const conn = peerData.conn;
            if (conn && conn.open) {
                conn.send({ type: 'REQ', fromSeq, toSeq });
            }
        }

        _processIncoming(senderId, data) {
            if (data.type === 'CHAT') {
                this._handleChat(senderId, data);
            } else if (data.type === 'REQ') {
                this._handleReq(senderId, data);
            } else if (data.type === 'HELLO') {
                const peerData = this.connections.get(senderId);
                if (peerData) peerData.name = data.name || 'ناشناس';
                if (this.callbacks.onData) this.callbacks.onData(senderId, data);
            } else if (data.type === 'SYNC' || data.type === 'STATUS' || data.type === 'SPEED' || data.type === 'NOTIFY' || data.type === 'HISTORY') {
                if (this.callbacks.onData) this.callbacks.onData(senderId, data);
            }
        }

        _handleChat(senderId, msg) {
            const peerData = this.connections.get(senderId);
            if (!peerData) return;
            const expected = peerData.expectedSeq;
            const receivedSeq = msg.seq;
            if (receivedSeq === expected) {
                this._deliverMessage(senderId, msg);
                peerData.expectedSeq++;
                // بررسی بافر
                let nextSeq = peerData.expectedSeq;
                while (peerData.pendingBuffer.has(nextSeq)) {
                    const buffered = peerData.pendingBuffer.get(nextSeq);
                    this._deliverMessage(senderId, buffered);
                    peerData.pendingBuffer.delete(nextSeq);
                    nextSeq++;
                    peerData.expectedSeq++;
                }
            } else if (receivedSeq > expected) {
                // پیام جلوتر – بافر و درخواست مجدد
                peerData.pendingBuffer.set(receivedSeq, msg);
                this.requestMissing(senderId, expected, receivedSeq - 1);
            } else {
                // پیام تکراری یا قدیمی – نادیده گرفته شود
                console.log('Duplicate/old message', receivedSeq, expected);
            }
        }

        _deliverMessage(senderId, msg) {
            const isSelf = (msg.senderId === myPeerId);
            let replyText = null;
            if (msg.replyToSeq) {
                // تلاش برای یافتن متن پیام اصلی از DOM (با استفاده از کلید)
                const originalKey = `${msg.senderId}:${msg.replyToSeq}`;
                const originalDiv = document.querySelector(`.chat-message[data-msg-key="${originalKey}"]`);
                if (originalDiv) {
                    const replyDiv = originalDiv.querySelector('div:not(.msg-info):not(.reply-indicator)');
                    if (replyDiv) replyText = replyDiv.innerText;
                }
                if (!replyText) replyText = `پیام #${msg.replyToSeq}`;
            }
            this._displayChatMessage(msg.senderId, msg.seq, msg.text, msg.sender, isSelf, msg.replyToSeq, replyText);
        }

        _displayChatMessage(peerId, seq, text, senderName, isSelf, replyToSeq, replyText) {
            const msgKey = `${peerId}:${seq}`;
            if (document.querySelector(`.chat-message[data-msg-key="${msgKey}"]`)) return;

            const div = document.createElement('div');
            div.className = `chat-message ${isSelf ? 'msg-self' : 'msg-other'}`;
            if (!isSelf && peerId) {
                div.style.backgroundColor = this._stringToColor(peerId);
            } else if (!isSelf) {
                div.style.backgroundColor = '#555';
            }
            div.setAttribute('data-msg-key', msgKey);

            let content = '';
            if (replyToSeq && replyText) {
                content += `<div class="reply-indicator">↪️ پاسخ به #${replyToSeq}: ${escapeHtml(replyText.substring(0, 50))}</div>`;
            }
            content += `<div>${escapeHtml(text)}</div>`;
            content += `<div class="msg-info">
                            <span>#${seq}</span>
                            <span>${escapeHtml(senderName)} • ${new Date().toLocaleTimeString('fa-IR')}</span>
                            <span class="reply-badge" data-peer="${peerId}" data-seq="${seq}" data-text="${escapeHtml(text)}">↩️ پاسخ</span>
                         </div>`;
            div.innerHTML = content;

            // رویداد ریپلای
            const replyBtn = div.querySelector('.reply-badge');
            replyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const targetPeer = replyBtn.dataset.peer;
                const targetSeq = replyBtn.dataset.seq;
                const targetText = replyBtn.dataset.text;
                // ذخیره در متغیر سراسری
                window._pendingReply = { peerId: targetPeer, seq: parseInt(targetSeq), text: targetText };
                msgInput.placeholder = `پاسخ به #${targetSeq}: ${targetText.substring(0, 30)}...`;
                msgInput.focus();
            });

            // درج بر اساس ترتیب seq
            let inserted = false;
            const children = messagesDiv.children;
            for (let i = 0; i < children.length; i++) {
                const child = children[i];
                const key = child.getAttribute('data-msg-key');
                if (key) {
                    const existingSeq = parseInt(key.split(':')[1]);
                    if (existingSeq > seq) {
                        messagesDiv.insertBefore(div, child);
                        inserted = true;
                        break;
                    }
                }
            }
            if (!inserted) messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        _stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = ((hash << 5) - hash) + str.charCodeAt(i);
                hash |= 0;
            }
            const hue = Math.abs(hash % 360);
            return `hsl(${hue}, 70%, 65%)`;
        }

        _handleReq(senderId, req) {
            // در این نسخه ساده، درخواست مجدد را نادیده می‌گیریم (چون پیام‌ها به صورت به نسبت قابل اعتماد ارسال می‌شوند)
            // برای پیاده‌سازی کامل باید تاریخچه خروجی نگهداری شود.
            console.log('Request missing from', senderId, req.fromSeq, req.toSeq);
        }

        _startHeartbeat(conn) {
            if (conn.heartbeatTimer) return;
            conn.heartbeatTimer = setInterval(() => { if (conn.open) conn.send({ type: 'PING' }); }, this.heartbeatInterval);
        }

        connect(remoteId) {
            if (remoteId === myPeerId || this.connections.has(remoteId)) return;
            const conn = this.peer.connect(remoteId, { reliable: true });
            this._handleConnection(conn);
        }

        onData(cb) { this.callbacks.onData = cb; }
        onStatus(cb) { this.callbacks.onStatus = cb; }
        onPeerConnected(cb) { this.callbacks.onPeerConnected = cb; }
        onPeerDisconnected(cb) { this.callbacks.onPeerDisconnected = cb; }
        _emitStatus(type, detail) { if (this.callbacks.onStatus) this.callbacks.onStatus({ type, detail, timestamp: Date.now() }); }
        destroy() { if (this.peer) this.peer.destroy(); }
    }

    // ========== موتور همگام‌سازی ویدئو (بهینه موبایل) ==========
    class VideoSyncEngine {
        constructor(player, network, getPeersFunc) {
            this.player = player;
            this.network = network;
            this.getConnectedPeers = getPeersFunc;
            this.syncLock = false;
            this.bufferingPeers = new Set();
            this.clockOffset = new Map();
            this.latencySamples = new Map();
            this.maxLatencySamples = 8;
            this.lastSyncTime = 0;
            this.SYNC_THROTTLE = 200;
            this._bindPlayerEvents();
        }
        _bindPlayerEvents() {
            this.player.addEventListener('play', () => this._onLocalPlay());
            this.player.addEventListener('pause', () => this._onLocalPause());
            this.player.addEventListener('waiting', () => this._onBufferingStart());
            this.player.addEventListener('canplay', () => this._onBufferingEnd());
            this.player.addEventListener('seeked', () => this._onLocalSeekThrottled());
            this.player.addEventListener('ratechange', () => this._onLocalRateChange());
        }
        _onLocalPlay() { if (!this.syncLock) this._broadcastSync('play', this.player.currentTime); }
        _onLocalPause() { if (!this.syncLock) this._broadcastSync('pause', this.player.currentTime); }
        _onLocalSeekThrottled() {
            if (this.syncLock) return;
            const now = Date.now();
            if (now - this.lastSyncTime < this.SYNC_THROTTLE) return;
            this.lastSyncTime = now;
            this._broadcastSync('seek', this.player.currentTime);
        }
        _onLocalRateChange() { if (!this.syncLock) this._broadcastSpeed(this.player.playbackRate); }
        _onBufferingStart() { this._broadcastStatus('buffering', true); }
        _onBufferingEnd() { this._broadcastStatus('buffering', false); }
        _broadcastSync(action, time) {
            for (let peerId of this.getConnectedPeers()) {
                const peerData = this.network.connections.get(peerId);
                if (peerData && peerData.conn) peerData.conn.send({ type: 'SYNC', action, time, senderTime: Date.now() });
            }
        }
        _broadcastSpeed(rate) {
            for (let peerId of this.getConnectedPeers()) {
                const peerData = this.network.connections.get(peerId);
                if (peerData && peerData.conn) peerData.conn.send({ type: 'SPEED', rate });
            }
        }
        _broadcastStatus(key, value) {
            for (let peerId of this.getConnectedPeers()) {
                const peerData = this.network.connections.get(peerId);
                if (peerData && peerData.conn) peerData.conn.send({ type: 'STATUS', key, value });
            }
        }
        setPlaybackRate(rate) {
            if (this.player.playbackRate !== rate) this.player.playbackRate = rate;
            this._broadcastSpeed(rate);
        }
        handleIncomingSync(senderId, data) {
            if (data.type === 'SYNC') this._applySync(senderId, data.action, data.time, data.senderTime);
            else if (data.type === 'SPEED') this.player.playbackRate = data.rate;
            else if (data.type === 'STATUS') this._applyStatus(senderId, data.key, data.value);
        }
        _applyStatus(senderId, key, value) {
            if (key === 'buffering') {
                if (value) this.bufferingPeers.add(senderId);
                else this.bufferingPeers.delete(senderId);
                this._checkBufferingState();
            }
        }
        _checkBufferingState() {
            if (this.bufferingPeers.size > 0 && !this.player.paused) this.player.pause();
            else if (this.bufferingPeers.size === 0 && this.player.paused && this._lastRemoteAction === 'play') this.player.play().catch(()=>{});
        }
        _applySync(senderId, action, time, senderTime) {
            if (this.syncLock) return;
            this.syncLock = true;
            let compensatedTime = time;
            if (senderTime) {
                const now = Date.now();
                let offset = 0;
                if (this.clockOffset.has(senderId)) offset = this.clockOffset.get(senderId).offset || 0;
                const elapsed = (now - (senderTime - offset)) / 1000;
                compensatedTime = time + elapsed;
                if (!this.latencySamples.has(senderId)) this.latencySamples.set(senderId, []);
                const samples = this.latencySamples.get(senderId);
                const rtt = now - senderTime;
                const estOffset = rtt/2;
                samples.push(estOffset);
                if(samples.length>this.maxLatencySamples) samples.shift();
                const avgOffset = samples.reduce((a,b)=>a+b,0)/samples.length;
                this.clockOffset.set(senderId, { offset: avgOffset, lastUpdate: now });
            }
            try {
                if (this.player.src && Math.abs(this.player.currentTime - compensatedTime) > 0.5) {
                    this.player.currentTime = compensatedTime;
                }
                if (action === 'play' || action === 'seek') this.player.play().catch(()=>{});
                else if (action === 'pause') this.player.pause();
                this._lastRemoteAction = action;
            } finally { setTimeout(()=>{ this.syncLock = false; }, 300); }
        }
        destroy() {}
    }

    // ========== راه‌اندازی اصلی ==========
    const network = new ReliableChatNetwork();
    function getConnectedPeerIds() { return Array.from(network.connections.keys()); }

    // توابع کمکی
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function sanitizeName(name) {
        let cleaned = name.trim().slice(0, 20);
        cleaned = cleaned.replace(/[<>]/g, '');
        return cleaned || 'ناشناس';
    }

    function formatTime(seconds) {
        if (isNaN(seconds)) return "00:00";
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = Math.floor(seconds % 60);
        if (hrs > 0) return `${hrs}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        return `${mins}:${secs.toString().padStart(2,'0')}`;
    }

    function updateUsersBar() {
        let html = `<span class="user-chip">👤 ${escapeHtml(myName)}</span>`;
        for (let [id, data] of network.connections.entries()) {
            html += `<span class="user-chip">👤 ${escapeHtml(data.name)}</span>`;
        }
        usersBar.innerHTML = html;
    }

    function loadDefaultVideo() {
        if (player._blobUrl) URL.revokeObjectURL(player._blobUrl);
        player.src = DEFAULT_VIDEO_URL;
        player.load();
    }

    // ورود
    btnLogin.addEventListener('click', () => {
        let rawName = nameInput.value.trim();
        if (!rawName) return alert('لطفاً نام خود را وارد کنید');
        myName = sanitizeName(rawName);
        loginOverlay.style.display = 'none';
        mainApp.style.display = 'flex';
        updateUsersBar();

        network.init();
        network.onStatus((status) => {
            if (status.type === 'ready') {
                statusTag.textContent = `🆔 ${status.detail.substring(0,6)}`;
                mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
                mqttClient.on('connect', () => {
                    mqttClient.subscribe('cinema_mesh_room_pro');
                    mqttClient.publish('cinema_mesh_room_pro', JSON.stringify({ peerId: myPeerId, name: myName }));
                });
                mqttClient.on('message', (topic, message) => {
                    try {
                        const data = JSON.parse(message.toString());
                        if (data.peerId && data.peerId !== myPeerId && !network.connections.has(data.peerId)) {
                            network.connect(data.peerId);
                        }
                    } catch(e) {}
                });
                loadDefaultVideo();
            }
        });

        network.onPeerConnected((peerId, conn) => {
            // ارسال HELLO برای تبادل نام
            if (conn && conn.open) {
                conn.send({ type: 'HELLO', name: myName, peerId: myPeerId });
            }
            updateUsersBar();
        });

        network.onPeerDisconnected((peerId) => {
            updateUsersBar();
            // نمایش پیام سیستمی خروج
            const msgDiv = document.createElement('div');
            msgDiv.className = 'chat-message msg-other';
            msgDiv.style.backgroundColor = '#555';
            msgDiv.innerHTML = `<div>🚪 کاربر ${escapeHtml(network.connections.get(peerId)?.name || peerId.substring(0,6))} خارج شد</div><div class="msg-info">سیستم • ${new Date().toLocaleTimeString('fa-IR')}</div>`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });

        network.onData((senderId, data) => {
            if (data.type === 'SYNC' || data.type === 'STATUS' || data.type === 'SPEED') {
                if (videoSyncEngine) videoSyncEngine.handleIncomingSync(senderId, data);
            } else if (data.type === 'NOTIFY') {
                // اعلان سیستمی
                const msgDiv = document.createElement('div');
                msgDiv.className = 'chat-message msg-other';
                msgDiv.style.backgroundColor = '#555';
                msgDiv.innerHTML = `<div>${escapeHtml(data.text)}</div><div class="msg-info">اطلاع • ${new Date().toLocaleTimeString('fa-IR')}</div>`;
                messagesDiv.appendChild(msgDiv);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }
        });

        videoSyncEngine = new VideoSyncEngine(player, network, getConnectedPeerIds);
    });

    // ارسال پیام چت
    function sendChatMessage() {
        let text = msgInput.value.trim();
        if (!text) return;
        let replyToSeq = null;
        if (window._pendingReply) {
            replyToSeq = window._pendingReply.seq;
            window._pendingReply = null;
            msgInput.placeholder = 'پیام...';
        }
        for (let peerId of getConnectedPeerIds()) {
            network.sendMessage(peerId, text, replyToSeq);
        }
        msgInput.value = '';
    }
    sendBtn.addEventListener('click', sendChatMessage);
    msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatMessage(); });

    // کنترل‌های ویدئو
    btnPlay.addEventListener('click', () => { if(player.src) player.play().catch(e=>alert('خطا در پخش')); });
    btnPause.addEventListener('click', () => { if(player.src) player.pause(); });
    speedSelect.addEventListener('change', () => { if(videoSyncEngine) videoSyncEngine.setPlaybackRate(parseFloat(speedSelect.value)); });

    // نوار پیشرفت
    seekBar.addEventListener('input', function() {
        if (!player.duration) return;
        isSeeking = true;
        const seekTo = (seekBar.value / 100) * player.duration;
        player.currentTime = seekTo;
    });
    seekBar.addEventListener('change', () => { isSeeking = false; });
    function updateProgress() {
        if (!isSeeking && player.duration) {
            const percent = (player.currentTime / player.duration) * 100;
            seekBar.value = percent;
            currentTimeSpan.textContent = formatTime(player.currentTime);
        }
        if (player.duration && !isNaN(player.duration)) {
            durationSpan.textContent = formatTime(player.duration);
            seekBar.max = 100;
        }
        rafId = requestAnimationFrame(updateProgress);
    }
    player.addEventListener('loadedmetadata', () => {
        durationSpan.textContent = formatTime(player.duration);
        seekBar.max = 100;
    });
    rafId = requestAnimationFrame(updateProgress);
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
    });
    fileUploader.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            if (player._blobUrl) URL.revokeObjectURL(player._blobUrl);
            const url = URL.createObjectURL(file);
            player._blobUrl = url;
            player.src = url;
            player.load();
            for (let peerId of getConnectedPeerIds()) {
                const peerData = network.connections.get(peerId);
                if (peerData && peerData.conn) peerData.conn.send({ type: 'NOTIFY', text: `${myName} یک ویدیوی محلی بارگذاری کرد (فقط برای خودش قابل مشاهده)` });
            }
        }
    });

    window.addEventListener('beforeunload', () => {
        if (rafId) cancelAnimationFrame(rafId);
        if (network) network.destroy();
        if (mqttClient) mqttClient.end();
    });
})();
</script>
</body>
</html>
