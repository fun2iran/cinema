<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>سینما کر | نسخه نهایی پایدار موبایل</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0b141a;
            color: #e9edef;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* برای نوارهای سیستم */
            padding-bottom: env(safe-area-inset-bottom);
        }
        .login {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0b141a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            gap: 15px;
        }
        .login h2 { color: #00a884; }
        .login input {
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            background: #2a3942;
            color: white;
            width: 220px;
            text-align: center;
            font-size: 16px;
        }
        .login button {
            padding: 10px 30px;
            border-radius: 30px;
            border: none;
            background: #00a884;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }
        #app {
            display: none;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }
        /* بخش بالایی ثابت - با sticky برای حالت فول اسکرین */
        .top-fixed {
            flex-shrink: 0;
            background: #0b141a;
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 35vh;
        }
        video {
            width: 100%;
            max-height: 35vh;
            background: black;
            display: block;
        }
        .progress-bar {
            background: #1e2a32;
            padding: 6px 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .time {
            font-size: 12px;
            background: #0b141a;
            padding: 2px 8px;
            border-radius: 15px;
        }
        input[type=range] {
            flex: 1;
            height: 4px;
            -webkit-appearance: none;
            background: #2a3942;
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #00a884;
            cursor: pointer;
        }
        .controls {
            background: #1e2a32;
            padding: 8px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #2f3b44;
        }
        button, select, label {
            background: #2a3942;
            border: none;
            color: white;
            padding: 6px 14px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 13px;
        }
        button:active { background: #3b4a54; }
        .accent { background: #00a884; }
        .status {
            font-size: 11px;
            margin-right: auto;
            color: #8696a0;
        }
        .users-bar {
            background: #1e2a32;
            padding: 5px 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            border-bottom: 1px solid #2f3b44;
        }
        .user-chip {
            background: #2a3942;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .msg {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.4;
        }
        .msg-self {
            align-self: flex-end;
            background-color: #00a884;
            border-bottom-left-radius: 5px;
        }
        .msg-other {
            align-self: flex-start;
            background-color: #2a3942;
            border-bottom-right-radius: 5px;
        }
        .reply-quote {
            font-size: 12px;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
            border-right: 2px solid #00a884;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .reply-quote .reply-sender {
            font-weight: bold;
            font-size: 11px;
            color: #a5f0c0;
        }
        .reply-quote .reply-text {
            font-size: 11px;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .msg-footer {
            font-size: 9px;
            opacity: 0.7;
            margin-top: 4px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .reply-btn {
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 0 6px;
            cursor: pointer;
            font-size: 10px;
        }
        .input-area {
            background: #1e2a32;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
            /* فاصله از نوار پایین سیستم */
            margin-bottom: env(safe-area-inset-bottom);
        }
        .reply-preview {
            background: #0b141a;
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        #msgInput {
            flex: 1;
            padding: 10px 15px;
            border-radius: 25px;
            border: none;
            background: #2a3942;
            color: white;
            outline: none;
            font-size: 14px;
        }
        #sendBtn {
            background: #00a884;
            padding: 0 20px;
        }
        .cancel-reply {
            background: none;
            border: none;
            color: #00a884;
            cursor: pointer;
        }
        @media (max-width: 400px) {
            button, select, label { padding: 4px 10px; font-size: 11px; }
            .time { font-size: 10px; }
        }
        /* حالت تمام صفحه: اطمینان از ثابت ماندن بالایی */
        :-webkit-full-screen .top-fixed {
            position: sticky;
            top: 0;
        }
        :fullscreen .top-fixed {
            position: sticky;
            top: 0;
        }
    </style>
</head>
<body>

<div id="loginBox" class="login">
    <h2>🎬 سینما کر</h2>
    <input type="text" id="userName" placeholder="نام شما" autocomplete="off">
    <button id="enterBtn">ورود به گروه</button>
</div>

<div id="app">
    <div class="top-fixed">
        <video id="video" playsinline crossorigin="anonymous"></video>
        <div class="progress-bar">
            <span class="time" id="currentTime">00:00</span>
            <input type="range" id="seekBar" value="0" step="0.01">
            <span class="time" id="duration">00:00</span>
            <button id="fullscreenBtn">⤢</button>
        </div>
        <div class="controls">
            <button id="playBtn">▶️</button>
            <button id="pauseBtn">⏸️</button>
            <select id="speedSelect">
                <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
                <option value="1" selected>1x</option><option value="1.25">1.25x</option>
                <option value="1.5">1.5x</option><option value="2">2x</option>
            </select>
            <label for="fileUpload" style="background:#00a884;">📁</label>
            <input type="file" id="fileUpload" accept="video/*" style="display:none">
            <span class="status" id="statusText">📡 در حال اتصال...</span>
        </div>
        <div class="users-bar" id="usersList"></div>
    </div>

    <div class="chat">
        <div class="messages" id="messagesList"></div>
        <div class="input-area">
            <div id="replyPreviewBox" class="reply-preview" style="display: none;">
                <span id="replyPreviewText"></span>
                <button id="cancelReplyBtn" class="cancel-reply">✖</button>
            </div>
            <div class="input-row">
                <input type="text" id="msgInput" placeholder="پیام...">
                <button id="sendBtn">ارسال</button>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ====================== تنظیمات ======================
        const VIDEO_URL = "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4";
        
        // عناصر DOM
        const loginBox = document.getElementById('loginBox');
        const userNameInput = document.getElementById('userName');
        const enterBtn = document.getElementById('enterBtn');
        const app = document.getElementById('app');
        const video = document.getElementById('video');
        const playBtn = document.getElementById('playBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const speedSelect = document.getElementById('speedSelect');
        const seekBar = document.getElementById('seekBar');
        const currentTimeSpan = document.getElementById('currentTime');
        const durationSpan = document.getElementById('duration');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const fileUpload = document.getElementById('fileUpload');
        const statusText = document.getElementById('statusText');
        const usersList = document.getElementById('usersList');
        const messagesList = document.getElementById('messagesList');
        const msgInput = document.getElementById('msgInput');
        const sendMsgBtn = document.getElementById('sendBtn');
        const replyPreviewBox = document.getElementById('replyPreviewBox');
        const replyPreviewText = document.getElementById('replyPreviewText');
        const cancelReplyBtn = document.getElementById('cancelReplyBtn');
        
        // متغیرهای وضعیت
        let myName = '';
        let myPeerId = null;
        let mqttClient = null;
        let peer = null;
        let connections = new Map(); // peerId -> { conn, name }
        let currentReply = null;
        let msgCounter = 1;
        let historyMessages = [];
        const MAX_HISTORY = 20;
        let syncLock = false;
        let lastSyncTime = 0;
        let displayedMsgSet = new Set();
        let isPeerReady = false;
        
        // ====================== توابع کمکی ======================
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function formatTime(sec) {
            if (isNaN(sec)) return "00:00";
            let mins = Math.floor(sec / 60);
            let secs = Math.floor(sec % 60);
            return `${mins}:${secs.toString().padStart(2,'0')}`;
        }
        
        function updateUsersUI() {
            let html = `<div class="user-chip">👤 ${escapeHtml(myName)}</div>`;
            for (let [id, info] of connections) {
                html += `<div class="user-chip">👤 ${escapeHtml(info.name)}</div>`;
            }
            usersList.innerHTML = html;
        }
        
        function addMessageToUI(senderId, msgId, text, senderName, isSelf, replyToId, replyText, replySenderName) {
            const key = `${senderId}:${msgId}`;
            if (displayedMsgSet.has(key)) return;
            displayedMsgSet.add(key);
            
            const div = document.createElement('div');
            div.className = `msg ${isSelf ? 'msg-self' : 'msg-other'}`;
            div.setAttribute('data-key', key);
            let content = '';
            if (replyToId && replyText) {
                content += `<div class="reply-quote">
                                <div class="reply-sender">${escapeHtml(replySenderName || senderName)}</div>
                                <div class="reply-text">${escapeHtml(replyText.substring(0, 80))}</div>
                            </div>`;
            }
            content += `<div>${escapeHtml(text)}</div>`;
            content += `<div class="msg-footer">
                            <span>#${msgId}</span>
                            <span>${escapeHtml(senderName)} • ${new Date().toLocaleTimeString('fa-IR')}</span>
                            <span class="reply-btn" data-peer="${senderId}" data-id="${msgId}" data-text="${escapeHtml(text)}" data-name="${escapeHtml(senderName)}">↩️ پاسخ</span>
                        </div>`;
            div.innerHTML = content;
            messagesList.appendChild(div);
            messagesList.scrollTop = messagesList.scrollHeight;
            
            const btn = div.querySelector('.reply-btn');
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentReply = {
                    peerId: btn.dataset.peer,
                    msgId: parseInt(btn.dataset.id),
                    text: btn.dataset.text,
                    senderName: btn.dataset.name
                };
                replyPreviewText.innerText = `پاسخ به ${currentReply.senderName}: "${currentReply.text.substring(0, 50)}..."`;
                replyPreviewBox.style.display = 'flex';
                msgInput.focus();
            });
            
            // ذخیره در تاریخچه
            const existing = historyMessages.find(m => m.id === msgId && m.senderId === senderId);
            if (!existing) {
                historyMessages.push({
                    id: msgId,
                    senderId: senderId,
                    senderName: senderName,
                    text: text,
                    replyToId: replyToId,
                    replyText: replyText,
                    replySenderName: replySenderName,
                    timestamp: Date.now()
                });
                if (historyMessages.length > MAX_HISTORY) historyMessages.shift();
            }
        }
        
        function addSystemMessage(text) {
            const div = document.createElement('div');
            div.className = 'msg msg-other';
            div.style.backgroundColor = '#555';
            div.innerHTML = `<div>${escapeHtml(text)}</div><div class="msg-footer">سیستم • ${new Date().toLocaleTimeString('fa-IR')}</div>`;
            messagesList.appendChild(div);
            messagesList.scrollTop = messagesList.scrollHeight;
        }
        
        function sendHistoryToPeer(conn) {
            if (historyMessages.length === 0) return;
            conn.send({ type: 'HISTORY', messages: historyMessages.slice() });
        }
        
        // ====================== ارسال پیام ======================
        function sendMessage() {
            let text = msgInput.value.trim();
            if (!text) return;
            let replyToId = null, replyText = null, replySenderName = null;
            if (currentReply) {
                replyToId = currentReply.msgId;
                replyText = currentReply.text;
                replySenderName = currentReply.senderName;
                currentReply = null;
                replyPreviewBox.style.display = 'none';
            }
            const msgId = msgCounter++;
            addMessageToUI(myPeerId, msgId, text, myName, true, replyToId, replyText, replySenderName);
            for (let [peerId, info] of connections) {
                if (info.conn && info.conn.open) {
                    info.conn.send({
                        type: 'CHAT',
                        msgId: msgId,
                        text: text,
                        sender: myName,
                        senderId: myPeerId,
                        replyToId: replyToId,
                        replyText: replyText,
                        replySenderName: replySenderName,
                        timestamp: Date.now()
                    });
                }
            }
            msgInput.value = '';
        }
        
        // ====================== راه‌اندازی اتصال Peer ======================
        function setupConnection(conn) {
            if (connections.has(conn.peer)) return;
            conn.on('open', () => {
                connections.set(conn.peer, { conn: conn, name: 'در حال دریافت...' });
                updateUsersUI();
                conn.send({ type: 'HELLO', name: myName, peerId: myPeerId });
                addSystemMessage(`✨ کاربر ${myName} وارد شد`);
                sendHistoryToPeer(conn);
            });
            conn.on('data', (data) => {
                if (data.type === 'HELLO') {
                    const info = connections.get(conn.peer);
                    if (info) {
                        info.name = data.name;
                        updateUsersUI();
                        addSystemMessage(`✨ کاربر ${data.name} وارد شد`);
                    }
                }
                else if (data.type === 'HISTORY') {
                    for (let msg of data.messages) {
                        const key = `${msg.senderId}:${msg.id}`;
                        if (!displayedMsgSet.has(key)) {
                            const isSelf = (msg.senderId === myPeerId);
                            addMessageToUI(msg.senderId, msg.id, msg.text, msg.senderName, isSelf, msg.replyToId, msg.replyText, msg.replySenderName);
                        }
                    }
                }
                else if (data.type === 'CHAT') {
                    const isSelf = (data.senderId === myPeerId);
                    addMessageToUI(data.senderId, data.msgId, data.text, data.sender, isSelf, data.replyToId, data.replyText, data.replySenderName);
                }
                else if (data.type === 'SYNC') {
                    if (syncLock) return;
                    syncLock = true;
                    let time = data.time;
                    if (Math.abs(video.currentTime - time) > 0.5) video.currentTime = time;
                    if (data.action === 'play') video.play();
                    else if (data.action === 'pause') video.pause();
                    setTimeout(() => { syncLock = false; }, 300);
                }
                else if (data.type === 'SPEED') {
                    video.playbackRate = data.rate;
                    speedSelect.value = data.rate;
                }
                else if (data.type === 'NOTIFY') {
                    addSystemMessage(data.text);
                }
            });
            conn.on('close', () => {
                const info = connections.get(conn.peer);
                if (info) {
                    addSystemMessage(`🚪 کاربر ${info.name} خارج شد`);
                    connections.delete(conn.peer);
                    updateUsersUI();
                }
            });
        }
        
        function initPeerAndMqtt() {
            const iceServers = [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
                { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ];
            peer = new Peer(null, { debug: 0, config: { iceServers } });
            
            peer.on('open', (id) => {
                myPeerId = id;
                isPeerReady = true;
                statusText.innerText = `🆔 ${id.substring(0,6)}`;
                
                mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt');
                mqttClient.on('connect', () => {
                    mqttClient.subscribe('cinema_final_room');
                    mqttClient.publish('cinema_final_room', JSON.stringify({ peerId: myPeerId, name: myName }));
                });
                mqttClient.on('message', (topic, msg) => {
                    try {
                        const data = JSON.parse(msg.toString());
                        if (data.peerId && data.peerId !== myPeerId && !connections.has(data.peerId) && peer && isPeerReady) {
                            const conn = peer.connect(data.peerId, { reliable: true });
                            if (conn) setupConnection(conn);
                        }
                    } catch(e) {}
                });
                
                video.src = VIDEO_URL;
                video.load();
            });
            
            peer.on('connection', (conn) => {
                setupConnection(conn);
            });
            
            peer.on('error', (err) => {
                console.error('Peer error:', err);
                statusText.innerText = `⚠️ خطا: ${err.message}`;
            });
        }
        
        // ====================== همگام‌سازی ویدیو ======================
        function broadcastSync(action, time) {
            if (syncLock) return;
            const now = Date.now();
            if (action === 'seek' && now - lastSyncTime < 200) return;
            lastSyncTime = now;
            for (let [peerId, info] of connections) {
                if (info.conn && info.conn.open) {
                    info.conn.send({ type: 'SYNC', action, time });
                }
            }
        }
        function broadcastSpeed(rate) {
            for (let [peerId, info] of connections) {
                if (info.conn && info.conn.open) {
                    info.conn.send({ type: 'SPEED', rate });
                }
            }
        }
        
        video.addEventListener('play', () => broadcastSync('play', video.currentTime));
        video.addEventListener('pause', () => broadcastSync('pause', video.currentTime));
        video.addEventListener('seeked', () => broadcastSync('seek', video.currentTime));
        video.addEventListener('ratechange', () => broadcastSpeed(video.playbackRate));
        
        // ====================== رویدادهای UI ======================
        enterBtn.addEventListener('click', () => {
            let name = userNameInput.value.trim();
            if (!name) return alert('لطفاً نام خود را وارد کنید');
            myName = escapeHtml(name);
            loginBox.style.display = 'none';
            app.style.display = 'flex';
            updateUsersUI();
            initPeerAndMqtt();
        });
        
        playBtn.addEventListener('click', () => video.play());
        pauseBtn.addEventListener('click', () => video.pause());
        speedSelect.addEventListener('change', () => {
            let rate = parseFloat(speedSelect.value);
            video.playbackRate = rate;
            broadcastSpeed(rate);
        });
        sendMsgBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });
        cancelReplyBtn.addEventListener('click', () => {
            currentReply = null;
            replyPreviewBox.style.display = 'none';
        });
        
        video.addEventListener('timeupdate', () => {
            if (!video.seeking) {
                seekBar.value = (video.currentTime / video.duration) * 100;
                currentTimeSpan.innerText = formatTime(video.currentTime);
            }
        });
        video.addEventListener('loadedmetadata', () => {
            durationSpan.innerText = formatTime(video.duration);
            seekBar.max = 100;
        });
        seekBar.addEventListener('input', () => {
            if (video.duration) {
                video.currentTime = (seekBar.value / 100) * video.duration;
            }
        });
        
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });
        
        // در حالت فول اسکرین، اطمینان از ثابت ماندن بالایی
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                // هیچ اقدام خاصی نیاز نیست، CSS کار می‌کند
            }
        });
        
        fileUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const url = URL.createObjectURL(file);
                video.src = url;
                video.load();
                for (let [peerId, info] of connections) {
                    if (info.conn && info.conn.open) {
                        info.conn.send({ type: 'NOTIFY', text: `${myName} یک ویدیوی محلی بارگذاری کرد (فقط برای خودش قابل مشاهده)` });
                    }
                }
            }
        });
        
        window.addEventListener('beforeunload', () => {
            if (peer) peer.destroy();
            if (mqttClient) mqttClient.end();
        });
    })();
</script>
</body>
</html>
