<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <title>Cinema Sync & Chat (Firebase)</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #020617;
      color: #f9fafb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: radial-gradient(circle at top, #1f2937, #020617);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 20px 45px rgba(0,0,0,0.7);
      border: 1px solid rgba(148,163,184,0.4);
    }
    h1 { margin: 0 0 10px; font-size: 22px; text-align: center; }
    h2 { margin: 0 0 8px; font-size: 18px; }
    .subtitle { text-align: center; font-size: 13px; color: #9ca3af; margin-bottom: 16px; }
    label { font-size: 13px; margin-bottom: 6px; display: block; }
    input, select, button { font-family: inherit; font-size: 14px; }
    input[type="text"] {
      width: 100%; padding: 8px 10px; border-radius: 10px;
      border: 1px solid #4b5563; background: #020617; color: #e5e7eb; outline: none;
    }
    input[type="text"]:focus {
      border-color: #6366f1; box-shadow: 0 0 0 1px rgba(99,102,241,0.5);
    }
    .btn {
      border: none; border-radius: 999px; padding: 8px 14px; cursor: pointer;
      background: linear-gradient(135deg, #6366f1, #ec4899); color: white; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-secondary {
      background: #111827; border-radius: 999px; padding: 7px 12px;
      border: 1px solid #4b5563; color: #e5e7eb; cursor: pointer;
    }
    .btn-secondary:hover { background: #1f2937; }
    .section { margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(55,65,81,0.7); }
    video { width: 100%; border-radius: 12px; background: #000; max-height: 230px; margin-top: 8px; }
    .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .row > * { flex: 1; }
    .pill {
      font-size: 11px; padding: 4px 8px; border-radius: 999px;
      background: rgba(31,41,55,0.9); color: #9ca3af;
      display: inline-flex; align-items: center; gap: 4px; margin-right: 4px; margin-top: 4px;
    }
    .chat-box {
      margin-top: 8px; border-radius: 12px; background: #020617;
      border: 1px solid #374151; padding: 8px; height: 160px; overflow-y: auto; font-size: 13px;
    }
    .msg { margin-bottom: 6px; }
    .msg.me span.name { color: #a5b4fc; }
    .msg.other span.name { color: #fbbf24; }
    .msg.system span.name { color: #22c55e; }
    .msg span.text { color: #e5e7eb; }
    .chat-input-row { display: flex; gap: 6px; margin-top: 8px; }
    .chat-input-row input { flex: 1; }
    .badge { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    .top-row {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; font-size: 12px; color: #9ca3af;
    }
    #users { font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  </style>
</head>
<body>

<div class="card" id="loginCard">
  <h1>🎬 Cinema Sync</h1>
  <p class="subtitle">نام خود را وارد کنید تا وارد اتاق مشترک تماشای فیلم و چت شوید.</p>
  <label for="nameInput">نام شما</label>
  <input type="text" id="nameInput" placeholder="مثلاً: علی" />
  <div style="margin-top: 14px; text-align: center;">
    <button class="btn" id="enterBtn">ورود به سینما</button>
  </div>
  <p class="badge">همهٔ کاربران به یک اتاق ثابت وصل می‌شوند.</p>
</div>

<div class="card" id="appCard" style="display:none;">
  <div class="top-row">
    <span id="userLabel"></span>
    <span id="roomLabel"></span>
  </div>

  <div id="users"></div>

  <h2>ویدیو پلیر همزمان</h2>
  <p class="subtitle">هر تغییری روی پخش، مکث، سرعت و زمان، بین همهٔ اعضا سینک می‌شود.</p>

  <label for="fileInput">انتخاب ویدیو از حافظه گوشی:</label>
  <input type="file" id="fileInput" accept="video/*" />
  <video id="video" controls></video>

  <div class="row">
    <button class="btn-secondary" id="playBtn">▶️ پخش</button>
    <button class="btn-secondary" id="pauseBtn">⏸️ مکث</button>
    <select id="speedSelect">
      <option value="1">سرعت 1x</option>
      <option value="1.2">1.2x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
  </div>

  <div style="margin-top: 6px;">
    <span class="pill">⏱ زمان: <span id="timeLabel">0.0s</span></span>
    <span class="pill">⚡ سرعت: <span id="rateLabel">1x</span></span>
  </div>

  <div class="section">
    <h2>چت همزمان</h2>
    <div class="chat-box" id="chatLog"></div>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." />
      <button class="btn-secondary" id="sendBtn">ارسال</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getDatabase,
    ref,
    push,
    onChildAdded,
    set,
    onValue,
    update
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ---- تنظیمات Firebase (یک پروژه رایگان بساز و این‌ها را جایگزین کن) ----
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  const ROOM_ID = "cinema-room";

  let userName = null;
  const clientId = Math.random().toString(36).substring(2, 10);

  const loginCard = document.getElementById("loginCard");
  const appCard   = document.getElementById("appCard");
  const nameInput = document.getElementById("nameInput");
  const enterBtn  = document.getElementById("enterBtn");

  const userLabel = document.getElementById("userLabel");
  const roomLabel = document.getElementById("roomLabel");
  const usersDiv  = document.getElementById("users");

  const fileInput = document.getElementById("fileInput");
  const video     = document.getElementById("video");
  const playBtn   = document.getElementById("playBtn");
  const pauseBtn  = document.getElementById("pauseBtn");
  const speedSelect = document.getElementById("speedSelect");
  const timeLabel = document.getElementById("timeLabel");
  const rateLabel = document.getElementById("rateLabel");

  const chatLog   = document.getElementById("chatLog");
  const chatInput = document.getElementById("chatInput");
  const sendBtn   = document.getElementById("sendBtn");

  enterBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    if (!name) return;
    userName = name;

    loginCard.style.display = "none";
    appCard.style.display   = "block";

    userLabel.textContent = "👤 " + userName;
    roomLabel.textContent = "🛋 اتاق: " + ROOM_ID;

    registerUser();
    listenUsers();
    listenChat();
    listenVideoState();
  });

  function registerUser() {
    const userRef = ref(db, "rooms/" + ROOM_ID + "/users/" + clientId);
    set(userRef, { name: userName, online: true });
  }

  function listenUsers() {
    const usersRef = ref(db, "rooms/" + ROOM_ID + "/users");
    onValue(usersRef, (snap) => {
      const val = snap.val() || {};
      const names = Object.values(val).filter(u => u.online).map(u => u.name);
      usersDiv.textContent = "حاضر: " + (names.join(" ، ") || "هیچ‌کس");
    });
  }

  function listenChat() {
    const chatRef = ref(db, "rooms/" + ROOM_ID + "/chat");
    onChildAdded(chatRef, (snap) => {
      const msg = snap.val();
      if (!msg) return;
      const who = msg.clientId === clientId ? "me" : "other";
      addChatMessage(msg.name, msg.text, who);
    });
  }

  function sendChat() {
    const text = chatInput.value.trim();
    if (!text) return;
    const chatRef = ref(db, "rooms/" + ROOM_ID + "/chat");
    push(chatRef, {
      clientId,
      name: userName,
      text,
      ts: Date.now()
    });
    chatInput.value = "";
  }

  sendBtn.addEventListener("click", sendChat);
  chatInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendChat();
  });

  function addChatMessage(name, text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;

    const nameSpan = document.createElement("span");
    nameSpan.className = "name";
    nameSpan.textContent = name + ": ";

    const textSpan = document.createElement("span");
    textSpan.className = "text";
    textSpan.textContent = text;

    div.appendChild(nameSpan);
    div.appendChild(textSpan);
    chatLog.appendChild(div);
    chatLog.scrollTop = chatLog.scrollHeight;
  }

  fileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
  });

  playBtn.addEventListener("click", () => {
    video.play();
    sendVideoState("play");
  });

  pauseBtn.addEventListener("click", () => {
    video.pause();
    sendVideoState("pause");
  });

  speedSelect.addEventListener("change", () => {
    const rate = parseFloat(speedSelect.value);
    video.playbackRate = rate;
    sendVideoState("rate");
  });

  video.addEventListener("seeked", () => {
    sendVideoState("seek");
  });

  video.addEventListener("timeupdate", () => {
    timeLabel.textContent = video.currentTime.toFixed(1) + "s";
  });

  function sendVideoState(action) {
    const stateRef = ref(db, "rooms/" + ROOM_ID + "/videoState");
    update(stateRef, {
      clientId,
      action,
      time: video.currentTime,
      rate: video.playbackRate,
      ts: Date.now()
    });
    updateLabels({ time: video.currentTime, rate: video.playbackRate });
  }

  function listenVideoState() {
    const stateRef = ref(db, "rooms/" + ROOM_ID + "/videoState");
    onValue(stateRef, (snap) => {
      const data = snap.val();
      if (!data || data.clientId === clientId) return;
      applyVideoState(data);
    });
  }

  function applyVideoState(data) {
    if (typeof data.time === "number") {
      video.currentTime = data.time;
    }
    if (typeof data.rate === "number") {
      video.playbackRate = data.rate;
      speedSelect.value = String(data.rate);
    }

    if (data.action === "play") video.play();
    if (data.action === "pause") video.pause();

    updateLabels(data);
  }

  function updateLabels(data) {
    timeLabel.textContent = (data.time || 0).toFixed(1) + "s";
    rateLabel.textContent = (data.rate || 1) + "x";
  }
</script>
</body>
</html>
